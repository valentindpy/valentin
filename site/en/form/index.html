*{box-sizing:border-box}
html,body{margin:0;padding:0}

a{color:var(--accent-ink)}
button,input,select,textarea{font:inherit;color:inherit}

.bande{height:4px;display:flex;margin:0 -16px 0}
.bande i{flex:1}
.bande i:nth-child(1){background:var(--urg)}
.bande i:nth-child(2){background:var(--dep)}
.bande i:nth-child(3){background:var(--pro)}
.bande i:nth-child(4){background:var(--ene)}
.screen{padding:20px 0 0;min-height:60vh}

/* ----- la coquille de l'application -----
   Installee sur l'ecran d'accueil, la page n'a plus de barre
   d'adresse : elle occupe l'ecran, et doit se comporter comme une
   application — pas de rebond elastique en haut de liste, pas de
   surlignage bleu au toucher, pas de selection de texte sur un
   bouton qu'on maintient une demi-seconde de trop. */
html{height:100%}
body{min-height:100dvh;overscroll-behavior-y:none}
button,.opt,.tile,.chip,.cta{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.opt,.cta,.tile,.chip{-webkit-user-select:none;user-select:none}
@media (display-mode:standalone){
  /* la barre d'adresse est partie : on reprend sa place, et le lien de
     retour vers le site n'a plus de sens dans une application */
  .app{padding-bottom:max(env(safe-area-inset-bottom,0px),24px)}
  .pied .hors-app{display:none}
}

function dots(){
  var seq = S.intent==="urgence" ? ["intent","trade","call"]
          : S.intent==="projet" ? ["intent","trade","where","scope","contact","done"]
          : S.intent==="energie" ? ["intent","trade","logement","foyer","contact","done"]
          : S.intent==="public" ? ["intent","entite","besoin","consultation","contact","done"]
          : ["intent","trade","where","contact","done"];

  return '<div class="dots">'+seq.map(function(_,n){return '<i class="'+(n<=i?"on":"")+'"></i>'}).join("")+'</div>';
}

function aides(S){
  var r=[],proprio=(S.occupation==="occupant"||S.occupation==="bailleur"),vieux=(S.anciennete==="plus15"||S.anciennete==="entre");
  if(S.devisSigne==="oui")r.push("Quote already signed: most grants must be applied for beforehand. Check this first, it is the blocking point.");
  if(S.occupation==="locataire")r.push("Tenant: the grants are applied for by the owner. They must be brought in before any pricing.");
  if(S.occupation==="syndicat")r.push("Communal areas: the application is in the owners' association's name, with a vote at the general meeting, and a scheme specific to managed buildings.");
  if(S.anciennete==="moins2")r.push("Property under two years old: the main renovation grants do not apply.");
  if(S.usage==="secondaire")r.push("Second home: the main State grant is reserved for main residences. Energy savings certificates remain available.");
  if(proprio&&vieux&&S.usage!=="secondaire")r.push("Profile eligible for the main State renovation grant, subject to the rates in force and an RGE-certified firm.");
  if(vieux)r.push("Energy savings certificates, funded by the energy suppliers: stackable and open to all income levels.");
  if((S.chauffage==="fioul"||S.chauffage==="gaz")&&(S.gestes.indexOf("pac_ae")>=0||S.gestes.indexOf("granules")>=0))
    r.push("Moving off a fossil fuel to a heat pump or wood pellets: the best-supported case, with enhanced grants.");
  if(S.revenus==="r1"||S.revenus==="r2")r.push("Lower income: enhanced grant rates, and an advance on costs under some schemes.");
  if(S.gestes.length>=2||S.gestes.indexOf("ampleur")>=0||S.dpe==="fg")
    r.push("Several measures, or a poorly rated property: large-scale renovation route, with a mandatory audit and support adviser. Full coordination work.");
  if(vieux)r.push("Reduced VAT on energy improvement work, and an interest-free loan for a main residence.");
  r.push("Local grants from the region, the department and the town: to be checked case by case, they often stack.");
  r.push("Amounts and conditions to be confirmed at the visit. The rates change every year: no figure should be quoted before checking.");
  return r;
}

/* Peut-on quitter l'ecran courant ?
   Cette question se posait a deux endroits : dans le rendu, qui desactive
   le bouton, et dans le gestionnaire de frappe, qui le reactive sans
   redessiner. Le second ne connaissait que trois ecrans sur dix. Taper son
   adresse sur « Travaux energetiques finances » ou sur le parcours des
   entites publiques desactivait donc le bouton a chaque touche, et le
   parcours ne pouvait plus s'achever — sauf a remplir le champ AVANT de
   faire le dernier choix, ce que personne ne fait.
   Une seule regle, consultee des deux cotes : les ecrans a venir ne
   pourront plus etre oublies d'un cote et pas de l'autre. */
function peutAvancer(){
  switch(step){
    case "trade":        return !!S.gestes.length;
    case "call":         return S.tel.length>=8;
    case "where":        return !!(S.lieu&&S.statut&&S.adresse.length>4);
    case "scope":        return !!(S.delai&&(S.presta.length||S.description.length>5));
    case "entite":       return !!(S.entite&&S.organisme.length>2&&S.fonction);
    case "besoin":       return !!(S.nature&&S.trades.length&&S.adresse.length>4);
    case "consultation": return !!(S.nbDevis&&S.montant);
    case "logement":     return !!(S.logement&&S.anciennete&&S.occupation&&S.usage&&S.adresse.length>4);
    case "foyer":        return !!(S.personnes&&S.revenus&&S.chauffage&&S.devisSigne);
    case "contact":      return okContact();
    default:             return true;
  }
}

       deux ne faisaient qu'un, la traduction du libelle changeait aussi
       la valeur : une demande venue de la page anglaise arrivait avec
       devisSigne="Yes", et l'avertissement du back-office, qui compare
       a "oui", ne se declenchait jamais — or c'est le point bloquant
       d'un dossier d'aides. Tous les autres champs fonctionnent deja
       ainsi ; celui-ci faisait exception. */
    h+='<p class="qn">Have you already signed a quote for this work?</p><div class="chips">'
      +[{id:"non",l:"No"},{id:"oui",l:"Yes"}].map(function(v){
      return '<button class="chip" data-devis="'+v.id+'" aria-pressed="'+(S.devisSigne===v.id)+'">'+v.l+'</button>'}).join("")+'</div>';
    if(S.devisSigne==="oui")h+='<p class="note" style="color:var(--urg)">Careful: grants must be applied for before the quote is signed. Call us before going any further.</p>';
    h+='<button class="cta" data-go="contact" '+(peutAvancer()?"":"disabled")+'>Continue</button>';
  }
  else if(step==="contact"){
    h+=dots()+back(S.intent==="projet"?"scope":S.intent==="energie"?"foyer":S.intent==="public"?"consultation":"where");
    h+='<p class="q">How should we reach you?</p><p class="qs">We answer ourselves, not a call centre.</p>';
    h+='<div class="col">'
      +'<input class="fld" id="c-nom" placeholder="First name and surname" value="'+esc(S.nom)+'" data-set="nom">'
      +'<input class="fld" id="c-tel" type="tel" inputmode="tel" placeholder="Phone" value="'+esc(S.tel)+'" data-set="tel">'
      +'<input class="fld" id="c-mail" type="email" inputmode="email" placeholder="Email'+(S.intent==="public"?" professionnel":" (recommended)")+'" value="'+esc(S.email)+'" data-set="email">'
      +'</div>';
    /* L'adresse reste facultative — un habitant n'en a pas toujours —
       mais elle n'est plus présentée comme un détail : c'est elle qui
       décide si la personne reçoit un accusé ou seulement un appel. */
    if(S.intent!=="public")h+='<p class="note">With an email address, you receive the acknowledgement carrying your request reference. Without one, we simply call you back.</p>';
    h+='<p class="qn">One photo is worth ten questions <span style="text-transform:none;letter-spacing:0">(optional)</span></p>';
    h+='<label class="opt n" for="f-photo" style="display:block;cursor:pointer">'
      +'<b>'+(FICHIERS.length?FICHIERS.length+" photo(s) attached ✓":"Add a photo")+'</b>'
      +'<span>'+(FICHIERS.length?"Tap to change your choice":"Often enough to quote without a visit")+'</span>'
      +'<input id="f-photo" type="file" accept="image/*" multiple hidden></label>';
    h+='<p class="qn">When should we call?</p><div class="chips">'+Object.keys(CRENEAUX).map(function(k){
      return '<button class="chip" data-creneau="'+k+'" aria-pressed="'+(S.creneau===k)+'">'+CRENEAUX[k]+'</button>'}).join("")+'</div>';
    h+='<label class="cbx"><input type="checkbox" id="c-ok" data-consent="1" '+(S.consent?"checked":"")+'><span>I agree to be contacted about my request. My details are used for that alone.</span></label>';
    h+='<button class="cta" data-go="done" '+(peutAvancer()?"":"disabled")+'>Send my request</button>';
  }
  else if(step==="envoi"){
    h+='<div class="ok"><div class="mark mark-att">…</div><p class="q">Sending</p>'
      +'<p class="qs">Just a few seconds.</p></div>';
  }
  else if(step==="done"){
    h+=ecranFinal();
  }
  sc.innerHTML=h;
  sc.scrollTop=keep;
  lastStep=step;
  paint();
}


/* ---------- référence, récapitulatif et envoi ---------- */
function reference(){
  var d=new Date(),p=function(n){return String(n).padStart(2,"0")};
  var lettre={urgence:"U",depannage:"D",projet:"P",energie:"E",public:"C"}[S.intent]||"X";
  return "VD-"+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+"-"+lettre
    +Math.random().toString(36).slice(2,5).toUpperCase();
}
function lib(o,k){return k&&o[k]?o[k]:""}
function recapitulatif(){
  var L=[],a=function(k,v){if(v)L.push(k+" : "+v)};
  L.push("REQUEST "+REF);
  L.push("");
  a("Type",lib({urgence:"Emergency",depannage:"Repair",projet:"Renovation project",
    energie:"Funded energy works",public:"Public tender"},S.intent));
  a("Trade",S.trades.map(function(id){return METIERS[id]||id}).join(", "));
  if(S.projet)a("Project",(PROJETS.filter(function(x){return x.id===S.projet})[0]||{}).l);
  a("Services",S.presta.map(function(k){return k.split("|")[1]}).join(", "));
  a("Location",lib(LIEUX,S.lieu));
  a("Requested by",S.statut?(STATUTS.filter(function(x){return x.id===S.statut})[0]||{}).l:"");
  a("Building",S.residence);
  a("Address",[S.adresse,S.precision].filter(Boolean).join(" — "));
  if(S.intent==="public"){
    a("Organisation",[lib(ENTITES,S.entite),S.organisme,S.service].filter(Boolean).join(" — "));
    a("Role",S.fonction);
    a("Type of request",lib(NATURES,S.nature));
    a("Site",S.site);
    a("Quotes requested",S.nbDevis);
    a("Estimated value",lib(MONTANTS,S.montant));
    a("Submission deadline",S.dateLimite);
    a("Documents required",S.pieces.join(", "));
    a("Internal reference",S.refInterne);
  }
  if(S.intent==="energie"){
    a("Measures considered",S.gestes.map(function(g){
      var x=GESTES.filter(function(y){return y.id===g})[0];return x?x.l:g}).join(", "));
    a("Property",[lib(LOGEMENTS,S.logement),lib(ANCIENS,S.anciennete),lib(USAGES,S.usage)].filter(Boolean).join(" — "));
    a("Occupancy",lib(OCCUPS,S.occupation));
    a("Household",[S.personnes?S.personnes+" person(s)":"",lib(REVENUS,S.revenus)].filter(Boolean).join(" — "));
    a("Heating",[lib(CHAUFFAGES,S.chauffage),S.dpe?"Energy rating "+lib(DPES,S.dpe):""].filter(Boolean).join(" — "));
    a("Quote already signed",S.devisSigne);
  }
  a("Deadline",[lib(DELAIS,S.delai),S.budget||"",S.ag?"AGM vote: "+S.ag:""].filter(Boolean).join(" — "));
  a("Description",S.description);
  a("Preferred time",lib(CRENEAUX,S.creneau));
  a("Photos attached",FICHIERS.length?String(FICHIERS.length):"");
  L.push("");
  a("Name",S.nom);
  a("Phone",S.tel);
  a("Email",S.email);
  if(RESCODE)a("QR code",RESCODE);
  L.push("");
  L.push("Sent from the VD Services form on "+new Date().toLocaleString("fr-FR")+".");
  return L.join("\n");
}
function charge(){
  var o={};
  Object.keys(S).forEach(function(k){o[k]=S[k]});
  o.ref=REF;o.resCode=RESCODE;o.recu=new Date().toISOString();
  o.recapitulatif=RECAP;o.source=param("depuis")||"qr";
  return o;
}
function lienMail(){
  return "mailto:"+CONFIG.mail
    +"?subject="+encodeURIComponent("Request "+REF+" — "+(S.nom||"")+" "+(S.residence||S.adresse||""))
    +"&body="+encodeURIComponent(RECAP);
}
/* ---------- écriture dans la base ----------
   Pas de bibliothèque : l'API de Supabase se parle en HTTP ordinaire.
   Une page de moins à charger sur un téléphone en 4G dans une cave. */
function entetes(extra){
  var h={"apikey":CONFIG.cle,"Authorization":"Bearer "+CONFIG.cle};
  if(extra)Object.keys(extra).forEach(function(k){h[k]=extra[k]});
  return h;
}
function uuid(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,function(c){
    var r=Math.random()*16|0;return (c==="x"?r:(r&0x3|0x8)).toString(16);
  });
}
function ligneDemande(id){
  return {
    id:id, ref:REF, recu:new Date().toISOString(),
    intent:S.intent, trades:S.trades, presta:S.presta, gestes:S.gestes, projet:S.projet,
    lieu:S.lieu, statut_demandeur:S.statut,
    residence:S.residence, res_code:RESCODE||null,
    adresse:S.adresse, ville:"", precision_lieu:S.precision,
    nom:S.nom, tel:S.tel, email:S.email, description:S.description,
    delai:S.delai, budget:S.budget, ag:S.ag, creneau:S.creneau,
    extra:{entite:S.entite,organisme:S.organisme,service:S.service,fonction:S.fonction,
      nature:S.nature,site:S.site,nbDevis:S.nbDevis,montant:S.montant,dateLimite:S.dateLimite,
      pieces:S.pieces,refInterne:S.refInterne,logement:S.logement,anciennete:S.anciennete,
      occupation:S.occupation,usage:S.usage,personnes:S.personnes,revenus:S.revenus,
      chauffage:S.chauffage,dpe:S.dpe,devisSigne:S.devisSigne},
    source:param("depuis")||"qr",
    etat:"nouvelle", exemple:false,
    journal:[{t:new Date().toISOString(),texte:"Request submitted from the form."}]
  };
}
function deposerPhotos(id){
  if(!FICHIERS.length)return Promise.resolve();
  return Promise.all(FICHIERS.slice(0,6).map(function(f,i){
    var ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"");
    var chemin=id+"/"+(i+1)+"."+ext;
    return fetch(CONFIG.base+"/storage/v1/object/photos/"+chemin,
        {method:"POST",headers:entetes({"Content-Type":f.type||"image/jpeg"}),body:f})
      .then(function(r){
        if(!r.ok)throw new Error("photo "+r.status);
        return fetch(CONFIG.base+"/rest/v1/photos",{method:"POST",
          headers:entetes({"Content-Type":"application/json","Prefer":"return=minimal"}),
          body:JSON.stringify({demande_id:id,moment:"avant",chemin:chemin,
            nom:f.name,taille:f.size,type_mime:f.type})});
      });
  }));
}
function envoyer(){
  REF=reference();RECAP=recapitulatif();
  if(!CONFIG.base||!CONFIG.cle){ENVOI="mail";step="done";render();return}
  step="envoi";render();
  var id=uuid(),fini=false;
  function fin(etat){if(fini)return;fini=true;clearTimeout(stop);ENVOI=etat;step="done";render()}
  var stop=setTimeout(function(){fin("erreur")},20000);
  fetch(CONFIG.base+"/rest/v1/demandes",{method:"POST",
      headers:entetes({"Content-Type":"application/json","Prefer":"return=minimal"}),
      body:JSON.stringify(ligneDemande(id))})
    .then(function(r){
      if(!r.ok)return r.text().then(function(t){throw new Error(r.status+" "+t)});
      /* la demande est passée : les photos ne doivent plus la faire échouer */
      return deposerPhotos(id).catch(function(e){console.warn("photos",e)});
    })
    .then(function(){fin("ok")})
    .catch(function(e){console.warn("depot",e);fin("erreur")});
}
/* Quelle que soit l'issue, le visiteur doit pouvoir repartir vers le site :
   sans cela, la page du QR code est un cul-de-sac. */
var RETOUR_ACCUEIL="<a class='cta sec' href='/en/' style='margin-top:22px'>Back to the home page</a>";
function ecranFinal(){
  var suite={urgence:"We'll call you back within minutes.",
    depannage:"We'll call you back today, work carried out within 72 hours.",
    energie:"We'll call you back within 48 hours with a view on the grants available.",
    public:"We'll call you back within 48 hours and start the tender with firms in the area."}[S.intent]
    ||"We'll call you back within 48 hours to arrange a visit.";
  if(ENVOI==="ok"){
    return '<div class="ok"><div class="mark">\\u2713</div><p class="q">Request received</p>'
      +'<p class="qs">'+suite+'</p><span class="ref">ref. '+esc(REF)+'</span>'
      +'<button class="cta sec" data-copier="1">Copy the summary</button>'
      +'<p class="note">Keep this reference, it is all you need for us to find your file.</p>'
      +RETOUR_ACCUEIL+'</div>';
  }
  if(ENVOI==="erreur"){
    return '<div class="ok"><div class="mark mark-err">!</div><p class="q">The message didn\'t go through</p>'
      +'<p class="qs">Nothing is lost: send it as a message, or call.</p>'
      +'<a class="cta" href="'+esc(lienMail())+'">Send by email</a>'
      +'<a class="cta sec" href="tel:'+esc(CONFIG.tel)+'">Call VD Services</a>'
      +'<button class="cta sec" data-copier="1">Copy the summary</button>'
      +'<div class="recap" id="recap">'+esc(RECAP)+'</div>'
      +RETOUR_ACCUEIL+'</div>';
  }
  return '<div class="ok"><div class="mark mark-att">\\u2709</div><p class="q">Last step: send it</p>'
    +'<p class="qs">Your request is ready. Tap the button and your email app opens with the summary already written. '
    +'All that\'s left is to send it'+(S.photo?", and attach your photos":"")+'.</p>'
    +'<a class="cta" href="'+esc(lienMail())+'">Send my request</a>'
    +'<a class="cta sec" href="tel:'+esc(CONFIG.tel)+'">Rather have a call</a>'
    +'<button class="cta sec" data-copier="1">Copy the summary</button>'
    +'<span class="ref">ref. '+esc(REF)+'</span>'
    +'<div class="recap" id="recap">'+esc(RECAP)+'</div>'
    +'<p class="note">'+suite+'</p>'
    +RETOUR_ACCUEIL+'</div>';
}
function copier(){
  var t=RECAP;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(fait,manuel);
  }else manuel();
  function fait(){toast("Summary copied")}
  function manuel(){
    var z=document.getElementById("recap");
    if(z&&window.getSelection){
      var r=document.createRange();r.selectNodeContents(z);
      var s=window.getSelection();s.removeAllRanges();s.addRange(r);
      toast("Selected: copy using your phone's menu");
    }else toast("Copying isn't available in this browser");
  }
}
function toast(m){
  var d=document.createElement("p");
  d.className="note";d.textContent=m;d.style.textAlign="center";
  var z=document.getElementById("screen");
  if(z)z.appendChild(d);
  setTimeout(function(){d.remove()},2600);
}

/* ---------- interactions ---------- */
document.getElementById("screen").addEventListener("click",function(e){
  var b=e.target.closest("button, a");
  if(!b)return;
  if(b.dataset.copier){e.preventDefault();copier();return}
  if(b.tagName==="A")return;
  if(b.disabled)return;
  var d=b.dataset;
  if(d.go==="done"){envoyer();return}
  if(d.intent){S.intent=d.intent;S.trades=[];S.presta=[];S.gestes=[];S.projet=null;step=d.intent==="public"?"entite":"trade"}
  else if(d.projet){
    var pr=PROJETS.filter(function(x){return x.id===d.projet})[0];
    S.projet=pr.id;S.trades=pr.t.slice();S.presta=[];step="where";
  }
  else if(d.trade){
    if(S.intent==="projet"||S.intent==="public"){
      var i=S.trades.indexOf(d.trade);
      if(i>=0)S.trades.splice(i,1);else S.trades.push(d.trade);
    }else{S.trades=[d.trade];step=S.intent==="urgence"?"call":"where"}
  }
  else if(d.presta){
    var ip=S.presta.indexOf(d.presta);
    if(ip>=0)S.presta.splice(ip,1);else S.presta.push(d.presta);
  }
  else if(d.addtrade){if(S.trades.indexOf(d.addtrade)<0)S.trades.push(d.addtrade)}
  else if(d.geste){
    var ig=S.gestes.indexOf(d.geste);
    if(ig>=0)S.gestes.splice(ig,1);else S.gestes.push(d.geste);
    S.trades=[];
    S.gestes.forEach(function(gid){
      var g=GESTES.filter(function(x){return x.id===gid})[0];
      if(g)g.t.forEach(function(t){if(S.trades.indexOf(t)<0)S.trades.push(t)});
    });
  }
  else if(d.defi){S.defi=!S.defi}
  else if(d.entite){S.entite=d.entite;S.statut="pro";S.lieu="commun"}
  else if(d.fonction){S.fonction=S.fonction===d.fonction?"":d.fonction}
  else if(d.nature){S.nature=d.nature}
  else if(d.nbdevis){S.nbDevis=d.nbdevis}
  else if(d.montant){S.montant=d.montant}
  else if(d.piece){
    var ip2=S.pieces.indexOf(d.piece);
    if(ip2>=0)S.pieces.splice(ip2,1);else S.pieces.push(d.piece);
  }
  else if(d.logement){S.logement=d.logement;S.lieu=d.logement==="copro"?"commun":"privatif"}
  else if(d.anciennete){S.anciennete=d.anciennete}
  else if(d.occupation){S.occupation=d.occupation;
    S.statut={occupant:"occupant",bailleur:"bailleur",locataire:"locataire",syndicat:"syndic"}[d.occupation]||null}
  else if(d.usage){S.usage=d.usage}
  else if(d.personnes){S.personnes=d.personnes}
  else if(d.revenus){S.revenus=d.revenus}
  else if(d.chauffage){S.chauffage=d.chauffage}
  else if(d.dpe){S.dpe=d.dpe}
  else if(d.devis){S.devisSigne=d.devis}
  else if(d.lieu){S.lieu=d.lieu}
  else if(d.statut){S.statut=S.statut===d.statut?null:d.statut}
  else if(d.ag){S.ag=d.ag}
  else if(d.delai){S.delai=d.delai}
  else if(d.budget){S.budget=S.budget===d.budget?null:d.budget}
  else if(d.photo){S.photo=!S.photo}
  else if(d.creneau){S.creneau=d.creneau}
  else if(d.go){step=d.go}
  else return;
  render();
});
document.getElementById("screen").addEventListener("change",function(e){
  if(e.target.id!=="f-photo")return;
  FICHIERS=[].slice.call(e.target.files||[]).slice(0,6);
  S.photo=FICHIERS.length>0;
  render();
});
document.getElementById("screen").addEventListener("input",function(e){
  var t=e.target;
  if(t.dataset.set){
    S[t.dataset.set]=t.value;
    var cta=document.querySelector("#screen .cta[data-go]");
    if(cta){
      /* La meme regle que le rendu, et non une copie : cette copie-ci
         ne connaissait que trois ecrans sur dix, et taper son adresse
         sur « Travaux energetiques finances » ou sur le parcours des
         entites publiques desactivait le bouton a chaque touche. */
      cta.disabled = !peutAvancer();
    }
  }
  if(t.dataset.consent){
    S.consent=t.checked;
    var c=document.querySelector("#screen .cta[data-go]");
    if(c)c.disabled=!okContact();
  }
});
init();

/* ---------- l'application ----------
   Le service worker garde la derniere version sous la main : dans un
   hall sans reseau, le formulaire s'ouvre quand meme. */
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("/sw.js").catch(function(){});
  });
}

/* L'invitation a installer. Android previent par un evenement, iOS ne
   previent de rien : la seule facon honnete est de dire ou se trouve
   le bouton, et de ne le dire qu'une fois. */
(function(){
  var REFUS="vds-install-refuse";
  var deja=false;
  try{deja=localStorage.getItem(REFUS)==="1"}catch(e){}
  var installee=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  if(deja||installee)return;

  var barre=document.createElement("div");
  barre.className="installer";
  document.body.appendChild(barre);

  function fermer(){
    barre.classList.remove("on");
    try{localStorage.setItem(REFUS,"1")}catch(e){}
  }
  function montrer(html,action){
    barre.innerHTML=html;
    var oui=barre.querySelector("[data-oui]"),non=barre.querySelector("[data-non]");
    if(oui&&action)oui.addEventListener("click",action);
    if(non)non.addEventListener("click",fermer);
    barre.classList.add("on");
  }

  var invite=null;
  window.addEventListener("beforeinstallprompt",function(ev){
    ev.preventDefault();invite=ev;
    montrer("<p><b>Install VD Services</b>To find it on your home screen, without going through the browser.</p>"
      +'<button class="non" data-non>Later</button><button data-oui>Install</button>',
      function(){
        barre.classList.remove("on");
        invite.prompt();
        invite.userChoice.then(function(){try{localStorage.setItem(REFUS,"1")}catch(e){}});
      });
  });
  window.addEventListener("appinstalled",function(){
    try{localStorage.setItem(REFUS,"1")}catch(e){}
    barre.classList.remove("on");
  });

  /* iOS : pas d'evenement, pas d'API. Une phrase, et on n'insiste pas. */
  var iOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  var safari=iOS&&!/crios|fxios|edgios/i.test(navigator.userAgent);
  if(safari){
    setTimeout(function(){
      if(barre.classList.contains("on"))return;
      montrer("<p><b>Keep it handy</b>Share button, then “Add to Home Screen”.</p>"
        +'<button class="non" data-non>Close</button>',null);
    },2500);
  }
})();
</script>
