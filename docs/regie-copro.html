<title>Régie Copro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#E9EBEF; --surface:#FFFFFF; --surface-2:#F2F4F7; --sunk:#DFE3EA;
  --ink:#131A24; --ink-2:#414B59; --ink-3:#6C7686;
  --line:#CDD3DC; --line-strong:#A7B0BE;
  --accent:#2E4E77; --accent-soft:#DCE5F1; --accent-ink:#2E4E77;
  --urg:#BC2F26; --urg-soft:#F8DFDB;
  --dep:#8E6206; --dep-soft:#F6E9C9;
  --pro:#20654A; --pro-soft:#D5E9DF;
  --shadow:0 1px 2px rgba(19,26,36,.06), 0 10px 30px -16px rgba(19,26,36,.28);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0D131B; --surface:#161D26; --surface-2:#1D2630; --sunk:#0A0F16;
  --ink:#E7ECF3; --ink-2:#B2BBC8; --ink-3:#828D9C;
  --line:#28313D; --line-strong:#3E4A59;
  --accent:#84ABD8; --accent-soft:#1C2C41; --accent-ink:#9CBEE4;
  --urg:#EE8F84; --urg-soft:#37201D; --dep:#DCB25C; --dep-soft:#312818; --pro:#78C8A0; --pro-soft:#142B21;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ground:#0D131B; --surface:#161D26; --surface-2:#1D2630; --sunk:#0A0F16;
  --ink:#E7ECF3; --ink-2:#B2BBC8; --ink-3:#828D9C;
  --line:#28313D; --line-strong:#3E4A59;
  --accent:#84ABD8; --accent-soft:#1C2C41; --accent-ink:#9CBEE4;
  --urg:#EE8F84; --urg-soft:#37201D; --dep:#DCB25C; --dep-soft:#312818; --pro:#78C8A0; --pro-soft:#142B21;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;letter-spacing:-.012em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--display);font-weight:700;font-size:1.12rem;letter-spacing:-.02em;padding:0 8px}
.brand span{display:block;font-family:var(--mono);font-size:.62rem;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:9px 10px;cursor:pointer;color:var(--ink-2);font-size:.93rem}
.rail nav button:hover{background:var(--surface-2)}
.rail nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.rail nav b{font-family:var(--mono);font-size:.7rem;background:var(--accent);color:var(--surface);border-radius:999px;padding:1px 7px;font-weight:500}
.rail nav button[aria-current="true"] b{background:var(--accent-ink)}
.railfoot{margin-top:auto;font-family:var(--mono);font-size:.65rem;letter-spacing:.06em;color:var(--ink-3);padding:0 8px;line-height:1.5}
.dotlive{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pro);margin-right:6px}
.dotoff{background:var(--urg)}
main{padding:26px clamp(16px,3vw,34px) 60px;min-width:0}
@media (max-width:840px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:12px;overflow-x:auto;padding:12px 16px}
  .rail nav{flex-direction:row;flex:1}
  .rail nav button{white-space:nowrap}
  .railfoot{display:none}
}

.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.head h1{font-size:clamp(1.5rem,3vw,2rem)}
.head p{color:var(--ink-3);font-size:.9rem;margin-top:3px}
.eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.btn{background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:9px 15px;font-family:var(--display);font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.btn.ghost{background:none;color:var(--ink-2);border:1px solid var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.85rem;cursor:pointer;color:var(--ink-2)}
.pill[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.search{flex:1;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.9rem}
select.sel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.87rem}

.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0;cursor:pointer;text-align:left;width:100%;overflow:hidden}
.row:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.row .stripe{background:var(--line-strong)}
.row.u .stripe{background:var(--urg)} .row.d .stripe{background:var(--dep)} .row.p .stripe{background:var(--pro)}
.row .mid{padding:13px 0;min-width:0}
.row .end{padding:13px 16px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;justify-content:center}
.row .t{display:block;font-family:var(--display);font-weight:600;font-size:.98rem;letter-spacing:-.01em}
.row .meta{display:block;font-size:.83rem;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
.ref{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;color:var(--ink-3)}
.tag{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:3px 7px;white-space:nowrap;border:1px solid}
.tag.u{color:var(--urg);border-color:var(--urg);background:var(--urg-soft)}
.tag.d{color:var(--dep);border-color:var(--dep);background:var(--dep-soft)}
.tag.p{color:var(--pro);border-color:var(--pro);background:var(--pro-soft)}
.tag.n{color:var(--ink-3);border-color:var(--line-strong);background:var(--surface-2)}
.tag.a{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}

.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.95fr);gap:20px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.card+.card{margin-top:14px}
.card h3{font-size:1rem;margin-bottom:3px}
.card .sub{font-size:.82rem;color:var(--ink-3);margin-bottom:12px}
.kv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:.9rem}
.kv:first-of-type{border-top:0}
.kv dt{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.kv dd{margin:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.82rem;color:var(--ink-2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.photo{aspect-ratio:4/3;border:1px solid var(--line);border-radius:5px;background:
  repeating-linear-gradient(135deg,var(--surface-2) 0 9px,var(--sunk) 9px 18px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:var(--ink-3);font-family:var(--mono);font-size:.64rem;text-align:center;padding:6px}
.photo:hover{border-color:var(--accent)}
.photo svg{width:22px;height:22px}
.journal{list-style:none;margin:0;padding:0}
.journal li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;font-size:.87rem;padding:7px 0;border-top:1px solid var(--line)}
.journal li:first-child{border-top:0}
.journal time{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);padding-top:2px}
.pick{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pick .r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--surface);padding:10px 13px}
.pick .r:hover{background:var(--surface-2)}
.pick .r.loin{background:var(--surface-2)}
.pick label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:11px;align-items:center;cursor:pointer;min-width:0}
.pick .sep{background:var(--surface-2);padding:7px 13px;font-family:var(--mono);font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
@media (max-width:520px){.pick .r{grid-template-columns:minmax(0,1fr) auto}.pick .rate{display:none}}
.nav-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.nav-tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:15px 16px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav-tile:hover{border-color:var(--accent);background:var(--accent-soft)}
.nav-tile b{font-family:var(--display);font-weight:600;font-size:.96rem}
.nav-tile i{font-family:var(--mono);font-style:normal;font-size:.74rem;color:var(--ink-3)}
.crumb{display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:.85rem;color:var(--ink-3);margin-bottom:14px}
.crumb button{background:none;border:0;color:var(--accent-ink);cursor:pointer;font-size:.85rem;padding:0;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.tag.ex{color:var(--ink-3);border-color:var(--line-strong);background:var(--surface-2);text-transform:none;letter-spacing:.04em}
.pick input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.pick .nm{font-weight:600;font-family:var(--display);font-size:.92rem}
.pick .ct{font-size:.78rem;color:var(--ink-3);margin-top:1px;overflow-wrap:anywhere}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars button,.stars span{background:none;border:0;padding:0;line-height:1;cursor:pointer;font-size:.85rem;color:var(--line-strong)}
.stars .f{color:var(--dep)}
.stars.ro button{cursor:default}
.rate{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-3);align-items:center}
.rate b{font-family:var(--mono);font-weight:500;color:var(--ink-2)}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
table.tbl th{font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:400;padding:0 10px 8px;white-space:nowrap}
table.tbl td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.85rem}
.scroll{overflow-x:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.tile dt{font-family:var(--mono);font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.tile dd{margin:4px 0 0;font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile dd small{font-size:.8rem;font-weight:500;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.copro{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--surface-2);margin-top:8px}
.copro h4{font-size:.92rem}
.copro .lots{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);letter-spacing:.05em}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:.92rem;width:100%}
.field textarea{min-height:74px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
dialog{border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;max-width:min(620px,94vw);width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,15,22,.55)}
.dlg-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dlg-h h3{font-size:1.05rem}
.dlg-h p{font-size:.82rem;color:var(--ink-3);margin-top:2px}
.dlg-b{padding:18px 20px;max-height:64vh;overflow-y:auto}
.dlg-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 10px 10px;flex-wrap:wrap}
.x{background:none;border:0;font-size:1.25rem;line-height:1;color:var(--ink-3);cursor:pointer;padding:2px 4px}
.mail{font-family:var(--mono);font-size:.8rem;line-height:1.7;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;width:100%;min-height:280px;resize:vertical}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:6px;padding:32px 22px;text-align:center;color:var(--ink-3)}
.empty h3{color:var(--ink);margin-bottom:6px}
.back{background:none;border:0;color:var(--ink-3);font-size:.85rem;cursor:pointer;padding:0;margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:8px;font-size:.88rem;box-shadow:var(--shadow);z-index:9;max-width:92vw}
.bd-in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:.85rem;font-family:var(--mono);text-align:right}
.bd-in.txt{text-align:left;font-family:var(--body)}
.warn{background:var(--dep-soft);border:1px solid var(--dep);color:var(--dep);border-radius:6px;padding:11px 14px;font-size:.85rem;line-height:1.5}
.note{font-size:.8rem;color:var(--ink-3);line-height:1.5}
</style>

<div class="shell">
  <aside class="rail">
    <div class="brand">Régie Copro<span>maîtrise d'œuvre</span></div>
    <nav id="nav"></nav>
    <div class="railfoot" id="railfoot"></div>
  </aside>
  <main><div id="view"></div></main>
</div>
<dialog id="dlg"></dialog>

<script>
/* ---------- constantes ---------- */
var MET={plomberie:"Plomberie",electricite:"Électricité",chauffage:"Chauffage",clim:"Climatisation, VMC",serrurerie:"Serrurerie",couverture:"Couverture, étanchéité",peinture:"Peinture",platrerie:"Plâtrerie",carrelage:"Carrelage, sols",menuiserie:"Menuiserie",verts:"Espaces verts",autre:"Autre"};
var INTENT={urgence:{l:"Urgence",c:"u"},depannage:{l:"Dépannage",c:"d"},projet:{l:"Projet",c:"p"}};
var ETATS={nouvelle:{l:"Nouvelle",c:"a"},devis:{l:"Devis demandé",c:"d"},chiffre:{l:"Chiffrée",c:"d"},planifiee:{l:"Planifiée",c:"p"},close:{l:"Clôturée",c:"n"}};
var STATUTS={occupant:"Propriétaire occupant",locataire:"Locataire",bailleur:"Propriétaire bailleur",syndic:"Syndic ou gestionnaire",conseil:"Conseil syndical",pro:"Commerce ou entreprise"};
var NAV=[{id:"demandes",l:"Demandes"},{id:"prestataires",l:"Prestataires"},{id:"clients",l:"Clients"},{id:"interventions",l:"Historique"}];

/* ---------- utilitaires ---------- */
function E(v){return String(v==null?"":v).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function eur(n){return (Math.round(n*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"}
function dt(iso){
  if(!iso)return "";
  var d=new Date(iso);
  if(isNaN(d))return iso;
  return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+" · "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}).replace(":"," h ");
}
function jour(iso){var d=new Date(iso);return isNaN(d)?iso:d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"})}
function stars(v,act,id){
  var o='<span class="stars'+(act?"":" ro")+'">';
  for(var i=1;i<=5;i++)o+='<button type="button" class="'+(i<=Math.round(v)?"f":"")+'"'+(act?' data-act="'+act+'" data-id="'+id+'" data-v="'+i+'"':" disabled")+' aria-label="'+i+' sur 5">★</button>';
  return o+'</span>';
}
function moy(p){return ((Number(p.qualite||0)+Number(p.reactivite||0))/2)}
function toast(m){
  var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);
  setTimeout(function(){t.remove()},2600);
}
function routage(d){
  if(d.intent==="urgence")return "direct";
  if((d.trades||[]).length>=2)return "moe";
  if(d.lieu==="commun")return "moe";
  if(["syndic","conseil","bailleur","pro"].indexOf(d.statutDemandeur)>=0)return "moe";
  return "direct";
}
function prestaLabels(d){return (d.presta||[]).map(function(k){return k.split("|")[1]})}
function metiersOf(d){return (d.trades||[]).map(function(t){return MET[t]||t})}

/* ---------- état ---------- */
var db=null,ready=false;
var DATA={demandes:[],prestataires:[],clients:[],interventions:[],bordereaux:[]};
var route={v:"demandes",id:null};
var flt={etat:"actives",q:"",metier:"",ville:"",tri:"note"};
var BD=null,bdTimer=null,qTimer=null;

function coll(name){
  return db.collection(name).onSnapshot(function(snap){
    DATA[name]=snap.docs.map(function(doc){var o=Object.assign({},doc.data()||{});o.id=doc.id;return o});
    ready=true;paint();
  },function(e){
    ready=true;DATA[name]=[];paint();
    console.warn("db "+name,e&&e.code);
  });
}
(async function boot(){
  paint();
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){ready=true;paint();return}
  Object.keys(DATA).forEach(coll);
})();

/* ---------- navigation ---------- */
function navigate(v,id){route={v:v,id:id||null};if(v!=="bordereau")BD=null;window.scrollTo(0,0);paint()}
function paintNav(){
  var nouvelles=DATA.demandes.filter(function(d){return d.etat==="nouvelle"}).length;
  document.getElementById("nav").innerHTML=NAV.map(function(n){
    var cur=(route.v===n.id)||(n.id==="demandes"&&(route.v==="demande"||route.v==="bordereau"));
    return '<button data-nav="'+n.id+'" aria-current="'+cur+'">'+n.l+(n.id==="demandes"&&nouvelles?' <b>'+nouvelles+'</b>':"")+'</button>';
  }).join("");
  document.getElementById("railfoot").innerHTML=db
    ? '<span class="dotlive"></span>Base connectée<br>'+DATA.demandes.length+' demandes · '+DATA.prestataires.length+' entreprises'
    : (ready?'<span class="dotlive dotoff"></span>Base indisponible<br>lecture seule':'Connexion…');
}

/* ---------- vue : liste des demandes ---------- */
function vDemandes(){
  var list=DATA.demandes.slice().sort(function(a,b){return (b.recu||"").localeCompare(a.recu||"")});
  if(flt.etat==="actives")list=list.filter(function(d){return d.etat!=="close"});
  else if(flt.etat!=="toutes")list=list.filter(function(d){return d.etat===flt.etat});
  if(flt.q){
    var q=flt.q.toLowerCase();
    list=list.filter(function(d){
      return [d.ref,d.nom,d.adresse,d.ville,d.residence,d.description].concat(metiersOf(d),prestaLabels(d))
        .join(" ").toLowerCase().indexOf(q)>=0;
    });
  }
  var h='<div class="head"><div><p class="eyebrow">Boîte de réception</p><h1>Demandes</h1>'
    +'<p>'+DATA.demandes.filter(function(d){return d.etat==="nouvelle"}).length+' nouvelle(s) · '
    +DATA.demandes.filter(function(d){return d.etat!=="close"}).length+' en cours de traitement</p></div>'
    +'<button class="btn ghost" data-act="demande-manuelle">+ Saisir une demande</button></div>';
  h+='<div class="bar">';
  [["actives","À traiter"],["nouvelle","Nouvelles"],["devis","Devis demandé"],["planifiee","Planifiées"],["close","Clôturées"],["toutes","Toutes"]]
    .forEach(function(f){h+='<button class="pill" data-flt="etat" data-v="'+f[0]+'" aria-pressed="'+(flt.etat===f[0])+'">'+f[1]+'</button>'});
  h+='<input class="search" id="q" placeholder="Chercher une adresse, un nom, un métier…" value="'+E(flt.q)+'"></div>';
  if(!list.length)return h+emptyBlock();
  h+='<div class="rows">'+list.map(function(d){
    var it=INTENT[d.intent]||{l:"?",c:"n"},et=ETATS[d.etat]||ETATS.nouvelle,r=routage(d);
    var titre=prestaLabels(d).slice(0,3).join(" · ")||metiersOf(d).join(" · ")||"Demande";
    return '<button class="row '+it.c+'" data-open="'+E(d.id)+'">'
      +'<span class="stripe"></span><span class="mid">'
      +'<span class="ref" style="display:block">'+E(d.ref)+' · '+dt(d.recu)+'</span>'
      +'<span class="t">'+E(titre)+'</span>'
      +'<span class="meta">'+E(d.nom)+' · '+E([d.residence,d.adresse,d.ville].filter(Boolean).join(", "))
      +' · '+(d.lieu==="commun"?"parties communes":d.lieu==="privatif"?"partie privative":"lieu à préciser")+'</span>'
      +'</span><span class="end">'
      +'<span class="tag '+it.c+'">'+it.l+'</span>'
      +'<span class="tag '+(r==="moe"?"p":"n")+'">'+(r==="moe"?"Maîtrise d\'œuvre":"Envoi direct")+'</span>'
      +'<span class="tag '+et.c+'">'+et.l+'</span>'+(d.exemple?'<span class="tag ex">exemple</span>':"")
      +'</span></button>';
  }).join("")+'</div>';
  return h;
}
function emptyBlock(){
  return db
    ? '<div class="empty"><h3>Aucune demande ici</h3><p>Changez de filtre, ou saisissez une demande reçue par téléphone.</p></div>'
    : '<div class="empty"><h3>Base de données indisponible</h3><p>Cette vue a besoin du stockage de l\'artifact. Ouvrez la page depuis votre compte pour retrouver vos données.</p></div>';
}

/* ---------- vue : détail d'une demande ---------- */
function vDemande(){

  h+='<div class="split"><div>';
  h+='<div class="card"><h3>Ce qui est demandé</h3><p class="sub">Tel que le demandeur l\'a rempli sur la page du QR code.</p>';
  h+='<div class="chips">'+(prestaLabels(d).map(function(l){return '<span class="chip on">'+E(l)+'</span>'}).join("")
     ||'<span class="chip">Rien de coché, voir la description</span>')+'</div>';

  h+=(d.photos||[]).length?'<div class="photos">'+(d.photos||[]).map(function(p,i){
      return '<button class="photo" data-act="photo" data-id="'+E(d.id)+'" data-v="'+i+'">'
      +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8.5A1.5 1.5 0 014.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0121 8.5v9A1.5 1.5 0 0119.5 19h-15A1.5 1.5 0 013 17.5z"/><circle cx="12" cy="13" r="3.2"/></svg>'
      +E(p.nom)+'<span>'+E(p.h||"")+'</span></button>';
    }).join("")+'</div>':'<p class="note">Rien de joint. Demandez une photo par SMS avant de déranger une entreprise.</p>';
  h+='</div></div><div>';
  h+='<div class="card"><h3>'+E(d.nom||"Demandeur")+'</h3><p class="sub">'+E(STATUTS[d.statutDemandeur]||"")+'</p><dl>'
    +kv("Téléphone",d.tel?'<a href="tel:'+E(tel(d.tel))+'">'+E(d.tel)+'</a>':"—")
    +(d.email?kv("E-mail",E(d.email)):"")
    +kv("Adresse",[d.residence,d.adresse,d.cp?d.cp+" "+d.ville:d.ville,d.precision].filter(Boolean).map(E).join("<br>"))
    +(d.coproNom?kv("Copropriété",E(d.coproNom)):"")
    +'</dl></div>';
  h+='<div class="card"><h3>Suivi</h3><ul class="journal">'
    +((d.journal||[]).slice().reverse().map(function(j){
      return '<li><time>'+E(jour(j.t))+'</time><span>'+E(j.texte)+'</span></li>'}).join("")
      ||'<li><time>'+E(jour(d.recu))+'</time><span>Demande reçue par le QR code.</span></li>')
    +'</ul></div>';
  h+='</div></div>';

  /* ---- bloc d'action, en bas de toutes les informations ---- */
  h+='<div class="card" style="margin-top:22px;border-color:var(--line-strong)">';
  h+='<h3>Traiter la demande</h3><p class="sub">Appelez, ou consultez les entreprises du secteur. Rien ne part sans que vous le déclenchiez.</p>';
  h+='<div class="actions">'
    +(d.tel?'<a class="btn" href="tel:'+E(tel(d.tel))+'">Appeler '+E(d.nom||"le demandeur")+'</a>':"")
    +'<button class="btn ghost" data-act="note" data-id="'+E(d.id)+'">Ajouter une note</button>'
    +'<button class="btn ghost" data-act="bordereau" data-id="'+E(d.id)+'">'+(bd?"Ouvrir le bordereau de prix":"Créer un bordereau de prix")+'</button>'
    +'<button class="btn ghost" data-act="cloturer" data-id="'+E(d.id)+'">Clôturer l\'intervention</button>'
    +'</div>';
  h+='<p class="eyebrow" style="margin:22px 0 9px">Entreprises concernées dans le secteur</p>';
  if(!cand.length)h+='<p class="note">Aucune entreprise du répertoire ne fait '+E(metiersOf(d).join(", ")||"ce métier")+'. Ajoutez un contact depuis l\'onglet Prestataires.</p>';
  else{
    h+='<p class="sub">'+cand.length+' entreprise(s) pour '+E(metiersOf(d).join(", "))
      +(locaux.length?' · '+locaux.length+' sur '+E(d.ville):"")+'. Cochez celles à consulter, ou appelez directement.</p>';
    h+='<div class="pick">';
    if(locaux.length)h+='<div class="sep">Sur '+E(d.ville||"la commune")+'</div>'+locaux.map(function(p){return pickRow(p,d,false)}).join("");
    if(loin.length)h+='<div class="sep">Ailleurs dans le secteur</div>'+loin.map(function(p){return pickRow(p,d,true)}).join("");
    h+='</div>';
    h+='<div class="actions" style="margin-top:16px;margin-bottom:0">'
      +'<button class="btn" data-act="mail" data-id="'+E(d.id)+'">Envoyer la demande de devis par mail</button>'
      +'<button class="btn ghost" data-act="save-pick" data-id="'+E(d.id)+'">Enregistrer la sélection</button>'
      +'<button class="btn ghost" data-act="appels" data-id="'+E(d.id)+'">Liste d\'appels</button>'
      +'</div>';
  }
  h+='</div>';
  return h;
}
function pickRow(p,d,loin){
  var on=(d.assignes||[]).indexOf(p.id)>=0;
  return '<div class="r'+(loin?" loin":"")+'">'
    +'<label><input type="checkbox" data-pick="'+E(p.id)+'"'+(on?" checked":"")+'>'
    +'<span><span class="nm">'+E(p.nom)+(p.exemple?' <span class="tag ex">exemple</span>':"")+'</span>'
    +'<span class="ct">'+E((p.metiers||[]).map(function(m){return MET[m]||m}).join(", "))+' · '+E((p.villes||[]).join(", "))+'</span></span></label>'
    +'<span class="rate">'+stars(moy(p))+'</span>'
    +(p.tel?'<a class="btn sm ghost" href="tel:'+E(tel(p.tel))+'">Appeler</a>':'<span class="note">pas de n°</span>')
    +'</div>';
}
function tel(t){return String(t||"").replace(/[^0-9+]/g,"")}
function kv(k,v){return '<div class="kv"><dt>'+k+'</dt><dd>'+v+'</dd></div>'}
function candidats(d){
  var mets=d.trades||[],ville=(d.ville||"").toLowerCase();
  return DATA.prestataires.filter(function(p){
    return (p.metiers||[]).some(function(x){return mets.indexOf(x)>=0});
  }).map(function(p){
    p.local=!!ville&&(p.villes||[]).some(function(x){return x.toLowerCase().indexOf(ville)>=0||ville.indexOf(x.toLowerCase())>=0});
    return p;
  }).sort(function(a,b){return (b.local?1:0)-(a.local?1:0)||moy(b)-moy(a)});
}

/* ---------- vue : bordereau de prix ---------- */
function vBordereau(){
  var d=DATA.demandes.filter(function(x){return x.id===route.id})[0];
  if(!d)return emptyBlock();
  if(!BD){
    var ex=DATA.bordereaux.filter(function(b){return b.id===d.id})[0];
    BD=ex?JSON.parse(JSON.stringify(ex)):{id:d.id,marge:12,envoye:false,prix:{},
      lignes:(prestaLabels(d).length?prestaLabels(d):["Prestation à décrire"]).map(function(l){return {d:l,u:"ens.",q:1}})};
    BD.prix=BD.prix||{};BD.lignes=BD.lignes||[];
  }
  var ents=(d.assignes||[]).map(function(id){return DATA.prestataires.filter(function(p){return p.id===id})[0]}).filter(Boolean);
  var h='<button class="back" data-nav="demande" data-id="'+E(d.id)+'">← Retour à la demande</button>';
  h+='<div class="head"><div><p class="eyebrow">'+E(d.ref)+' · '+E(d.nom)+' · '+E([d.residence,d.ville].filter(Boolean).join(", "))+'</p>'
    +'<h1>Bordereau de prix</h1><p>Les entreprises chiffrent poste par poste. Vous comparez, vous appliquez votre marge, vous envoyez au client.</p></div>'
    +'<div class="chips">'
    +'<button class="btn ghost sm" data-act="bd-copy-vierge">Copier le bordereau vierge</button>'
    +'<button class="btn sm" data-act="bd-copy-client">Copier le devis client</button></div></div>';
  if(!ents.length)h+='<div class="warn">Aucune entreprise sélectionnée sur cette demande. Revenez à la fiche et cochez celles à consulter : leurs colonnes de prix apparaîtront ici.</div><div style="height:14px"></div>';
  h+='<div class="card"><div class="scroll"><table class="tbl"><thead><tr>'
    +'<th style="width:34%">Désignation</th><th class="num">U</th><th class="num">Qté</th>'
    +ents.map(function(p){return '<th class="num">'+E(p.nom)+'</th>'}).join("")
    +'<th class="num">Retenu</th><th class="num">Prix client</th><th></th></tr></thead><tbody id="bdbody">'
    +BD.lignes.map(function(l,i){return bdRow(l,i,ents)}).join("")
    +'</tbody><tfoot><tr>'
    +'<td colspan="3" style="font-family:var(--display);font-weight:600">Total</td>'
    +ents.map(function(p){return '<td class="num" id="tot-'+E(p.id)+'">'+eur(totEnt(p.id))+'</td>'}).join("")
    +'<td class="num" id="tot-ret">'+eur(totRetenu())+'</td>'
    +'<td class="num" id="tot-cli" style="font-weight:600">'+eur(totClient())+'</td><td></td></tr></tfoot></table></div>';
  h+='<div class="chips" style="margin-top:16px;align-items:center">'
    +'<button class="btn sm ghost" data-act="bd-add">+ Ajouter une ligne</button>'
    +'<span class="note">Marge appliquée au prix client</span>'
    +'<input class="bd-in" id="marge" style="width:80px" type="number" min="0" max="60" step="1" value="'+E(BD.marge)+'" data-act="bd-marge"><span class="note">%</span>'
    +'<button class="btn sm ghost" data-act="bd-envoye">'+(BD.envoye?"Marquer comme non envoyé":"Marquer comme envoyé aux entreprises")+'</button>'
    +'</div>';
  h+='<p class="note" style="margin-top:12px">Le « retenu » est le moins-disant des prix saisis. Le prix client est le retenu majoré de votre marge. Le client ne voit jamais les colonnes des entreprises.</p></div>';
  return h;
}
function bdRow(l,i,ents){
  return '<tr data-i="'+i+'">'
    +'<td><input class="bd-in txt" data-bd="d" data-i="'+i+'" value="'+E(l.d)+'"></td>'
    +'<td class="num"><input class="bd-in" style="width:62px" data-bd="u" data-i="'+i+'" value="'+E(l.u)+'"></td>'
    +'<td class="num"><input class="bd-in" style="width:62px" type="number" step="0.5" min="0" data-bd="q" data-i="'+i+'" value="'+E(l.q)+'"></td>'
    +ents.map(function(p){
      var v=(BD.prix[p.id]||[])[i];
      return '<td class="num"><input class="bd-in" style="width:86px" type="number" step="1" min="0" placeholder="—" data-bd="p" data-p="'+E(p.id)+'" data-i="'+i+'" value="'+(v==null?"":E(v))+'"></td>';
    }).join("")
    +'<td class="num" id="ret-'+i+'">'+(retenu(i)==null?"—":eur(retenu(i)*Number(l.q||0)))+'</td>'
    +'<td class="num" id="cli-'+i+'">'+(retenu(i)==null?"—":eur(retenu(i)*Number(l.q||0)*(1+Number(BD.marge||0)/100)))+'</td>'
    +'<td><button class="x" data-act="bd-del" data-i="'+i+'" aria-label="Supprimer la ligne">×</button></td></tr>';
}
function retenu(i){
  var vals=Object.keys(BD.prix).map(function(pid){return Number((BD.prix[pid]||[])[i])}).filter(function(v){return v>0});
  return vals.length?Math.min.apply(null,vals):null;
}
function totEnt(pid){
  return BD.lignes.reduce(function(s,l,i){var v=Number((BD.prix[pid]||[])[i])||0;return s+v*Number(l.q||0)},0);
}
function totRetenu(){return BD.lignes.reduce(function(s,l,i){var r=retenu(i);return s+(r?r*Number(l.q||0):0)},0)}
function totClient(){return totRetenu()*(1+Number(BD.marge||0)/100)}
function bdRefresh(){
  var d=DATA.demandes.filter(function(x){return x.id===route.id})[0]||{};
  var ents=(d.assignes||[]).map(function(id){return DATA.prestataires.filter(function(p){return p.id===id})[0]}).filter(Boolean);
  BD.lignes.forEach(function(l,i){
    var r=retenu(i),q=Number(l.q||0);
    var a=document.getElementById("ret-"+i),b=document.getElementById("cli-"+i);
    if(a)a.textContent=r==null?"—":eur(r*q);
    if(b)b.textContent=r==null?"—":eur(r*q*(1+Number(BD.marge||0)/100));
  });
  ents.forEach(function(p){var e=document.getElementById("tot-"+p.id);if(e)e.textContent=eur(totEnt(p.id))});
  var tr=document.getElementById("tot-ret"),tc=document.getElementById("tot-cli");
  if(tr)tr.textContent=eur(totRetenu());
  if(tc)tc.textContent=eur(totClient());
  clearTimeout(bdTimer);bdTimer=setTimeout(bdSave,700);
}
function bdSave(){
  if(!db||!BD)return;
  var b=JSON.parse(JSON.stringify(BD));delete b.id;
  db.doc("bordereaux/"+BD.id).set(b).catch(function(e){toast("Enregistrement impossible : "+(e&&e.code||"erreur"))});
}

/* ---------- vue : prestataires (domaine → ville → entreprises) ---------- */
function carte(p){

    +'<p class="sub">'+E((p.villes||[]).join(" · "))+'</p></div>'
    +'<button class="btn sm ghost" data-act="presta-edit" data-id="'+E(p.id)+'">Modifier</button></div>'
    +'<div class="chips">'+(p.metiers||[]).map(function(m){return '<span class="chip">'+E(MET[m]||m)+'</span>'}).join("")+'</div>'
    +'<dl style="margin-top:12px">'
    +kv("Contact",E(p.contact||"—")+(p.tel?' · <a href="tel:'+E(tel(p.tel))+'">'+E(p.tel)+'</a>':""))
    +(p.email?kv("E-mail",E(p.email)):"")
    +kv("Qualité",stars(p.qualite||0,"note-q",p.id))
    +kv("Réactivité",stars(p.reactivite||0,"note-r",p.id))
    +kv("Interventions",nb+(p.assurance?" · décennale "+E(p.assurance):""))
    +(p.remarques?kv("Remarques",E(p.remarques)):"")
    +'</dl>'
    +(p.tel?'<div class="actions" style="margin:14px 0 0"><a class="btn sm" href="tel:'+E(tel(p.tel))+'">Appeler</a>'
      +(p.email?'<a class="btn sm ghost" href="mailto:'+E(p.email)+'">Écrire</a>':"")+'</div>':"")
    +'</div>';
}
function vPrestataires(){
  var all=DATA.prestataires;
  var h='<div class="head"><div><p class="eyebrow">Répertoire</p><h1>Prestataires</h1>'
    +'<p>'+all.length+' entreprises du secteur, de Fréjus à Nice. Choisissez un domaine, puis une ville.</p></div>'
    +'<div class="actions" style="margin:0"><button class="btn ghost" data-act="purge">Vider les exemples</button>'
    +'<button class="btn" data-act="presta-new">+ Ajouter une entreprise</button></div></div>';
  h+='<div class="bar"><input class="search" id="q" placeholder="Chercher une entreprise, une ville…" value="'+E(flt.q)+'"></div>';

  if(flt.q){
    var q=flt.q.toLowerCase();
    var res=all.filter(function(p){
      return (p.nom+" "+(p.villes||[]).join(" ")+" "+(p.metiers||[]).map(function(m){return MET[m]||m}).join(" ")).toLowerCase().indexOf(q)>=0;
    }).sort(function(a,b){return moy(b)-moy(a)});
    h+='<p class="eyebrow" style="margin-bottom:10px">'+res.length+' résultat(s)</p>';
    return h+(res.length?'<div class="grid2">'+res.map(carte).join("")+'</div>':emptyBlock());
  }

  /* étape 1 : les domaines */
  if(!flt.metier){
    var parMetier={};
    all.forEach(function(p){(p.metiers||[]).forEach(function(m){parMetier[m]=(parMetier[m]||0)+1})});
    var keys=Object.keys(MET).filter(function(m){return parMetier[m]});
    h+='<p class="eyebrow" style="margin-bottom:10px">Domaines</p><div class="nav-tiles">'
      +keys.map(function(m){
        return '<button class="nav-tile" data-flt="metier" data-v="'+E(m)+'"><b>'+E(MET[m])+'</b><i>'+parMetier[m]+'</i></button>';
      }).join("")+'</div>';
    var sans=Object.keys(MET).filter(function(m){return !parMetier[m]&&m!=="autre"});
    if(sans.length)h+='<p class="note" style="margin-top:16px">Aucun contact pour : '+E(sans.map(function(m){return MET[m]}).join(", "))+'.</p>';
    return h;
  }

  var dom=all.filter(function(p){return (p.metiers||[]).indexOf(flt.metier)>=0});
  h+='<div class="crumb"><button data-flt="metier" data-v="">Tous les domaines</button><span>›</span>'
    +'<strong>'+E(MET[flt.metier]||flt.metier)+'</strong>'
    +(flt.ville?'<span>›</span><button data-flt="ville" data-v="">Toutes les villes</button><span>›</span><strong>'
      +E(flt.ville==="*"?"Tout le secteur":flt.ville)+'</strong>':"")+'</div>';

  /* étape 2 : les villes */
  if(!flt.ville){
    var parVille={};
    dom.forEach(function(p){(p.villes||[]).forEach(function(v){parVille[v]=(parVille[v]||0)+1})});
    h+='<p class="eyebrow" style="margin-bottom:10px">Villes couvertes</p><div class="nav-tiles">'
      +'<button class="nav-tile" data-flt="ville" data-v="*"><b>Tout le secteur</b><i>'+dom.length+'</i></button>'
      +Object.keys(parVille).sort().map(function(v){
        return '<button class="nav-tile" data-flt="ville" data-v="'+E(v)+'"><b>'+E(v)+'</b><i>'+parVille[v]+'</i></button>';
      }).join("")+'</div>';
    return h;
  }

  /* étape 3 : les entreprises */
  var list=(flt.ville==="*"?dom:dom.filter(function(p){return (p.villes||[]).indexOf(flt.ville)>=0}))
    .sort(function(a,b){
      if(flt.tri==="reactivite")return (b.reactivite||0)-(a.reactivite||0);
      if(flt.tri==="qualite")return (b.qualite||0)-(a.qualite||0);
      if(flt.tri==="nom")return String(a.nom).localeCompare(String(b.nom));
      return moy(b)-moy(a);
    });
  h+='<div class="bar"><select class="sel" data-flt="tri">'
    +[["note","Note globale"],["qualite","Qualité du travail"],["reactivite","Réactivité"],["nom","Nom"]].map(function(t){
      return '<option value="'+t[0]+'"'+(flt.tri===t[0]?" selected":"")+'>Trier : '+t[1]+'</option>'}).join("")
    +'</select><span class="note">'+list.length+' entreprise(s)</span></div>';
  return h+(list.length?'<div class="grid2">'+list.map(carte).join("")+'</div>':emptyBlock());
}

function closeDlg(){if(dlg.open)dlg.close()}
function val(id){var e=document.getElementById(id);return e?e.value.trim():""}
function fld(id,label,v,type,ph){
  return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+(type||"text")+'" value="'+E(v||"")+'" placeholder="'+E(ph||"")+'"></div>';
}
function area(id,label,v,ph){
  return '<div class="field"><label for="'+id+'">'+label+'</label><textarea id="'+id+'" placeholder="'+E(ph||"")+'">'+E(v||"")+'</textarea></div>';
}
function copier(txt,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast(msg||"Copié")},function(){fallback(txt,msg)});
  }else fallback(txt,msg);
}
function fallback(txt,msg){
  var t=document.createElement("textarea");t.value=txt;t.style.position="fixed";t.style.opacity="0";
  document.body.appendChild(t);t.select();
  try{document.execCommand("copy");toast(msg||"Copié")}catch(e){toast("Sélectionnez le texte puis copiez-le")}
  t.remove();
}
function journalise(d,texte){
  var j=(d.journal||[]).slice();
  j.push({t:new Date().toISOString(),texte:texte});
  return j;
}
function maj(id,patch){
  if(!db){toast("Base indisponible");return Promise.resolve()}
  return db.doc("demandes/"+id).update(patch).catch(function(e){toast("Écriture refusée : "+(e&&e.code||"erreur"))});
}

function texteBordereau(d,avecPrix){
  var L=[];
  L.push(avecPrix?"DEVIS — "+d.ref:"BORDEREAU DE PRIX À COMPLÉTER — "+d.ref);
  L.push([d.residence,d.adresse,[d.cp,d.ville].filter(Boolean).join(" ")].filter(Boolean).join(", "));
  L.push("");
  L.push(avecPrix?"Poste | Qté | P.U. | Total":"Poste | U | Qté | P.U. (à compléter) | Total");
  L.push("");
  BD.lignes.forEach(function(l,i){
    var r=retenu(i),q=Number(l.q||0);
    if(avecPrix){
      var pu=r==null?null:r*(1+Number(BD.marge||0)/100);
      L.push(l.d+" | "+q+" "+l.u+" | "+(pu==null?"—":eur(pu))+" | "+(pu==null?"—":eur(pu*q)));
    }else L.push(l.d+" | "+l.u+" | "+q+" | ............ | ............");
  });
  L.push("");
  if(avecPrix){
    L.push("TOTAL HT : "+eur(totClient()));
    L.push("");
    L.push("Devis établi par Valentin Dupuy, maître d'œuvre, Mandelieu-la-Napoule. Validité 30 jours.");
  }else{
    L.push("Merci de compléter la colonne prix unitaire et de me retourner le document.");
    L.push("Les quantités sont indicatives, à vérifier sur place.");
  }
  return L.join("\n");
}

      +'<p class="note" style="margin-top:12px">Classées par réactivité si vous les avez notées. Appelez dans l\'ordre, la première qui décroche prend le créneau.</p>',
      '<button class="btn ghost" data-act="dlg-close">Fermer</button>'
      +'<button class="btn" data-act="appels-log" data-id="'+E(d.id)+'">Noter que j\'ai appelé</button>');
    return;
  }
  if(act==="appels-log"){
    var noms=(d.assignes||[]).map(function(pid){var x=DATA.prestataires.filter(function(y){return y.id===pid})[0];return x?x.nom:pid});
    maj(d.id,{etat:"devis",journal:journalise(d,"Appel passé à "+(noms.join(", ")||"une entreprise")+".")});
    closeDlg();toast("Appel enregistré dans le suivi");return;
  }
  if(act==="purge"){
    openDlg("Vider les exemples","Supprime uniquement les fiches marquées « exemple ». Ce que vous avez saisi vous-même est conservé.",
      '<p class="warn">'+["prestataires","clients","demandes","interventions"].map(function(c){
        return DATA[c].filter(function(x){return x.exemple}).length+" "+c}).join(" · ")+' seront supprimés.</p>',
      '<button class="btn ghost" data-act="dlg-close">Annuler</button><button class="btn" data-act="purge-go">Supprimer</button>');
    return;
  }
  if(act==="purge-go"){
    if(!db){toast("Base indisponible");return}
    var jobs=[];
    ["prestataires","clients","demandes","interventions","bordereaux"].forEach(function(c){
      DATA[c].filter(function(x){return x.exemple}).forEach(function(x){jobs.push(db.doc(c+"/"+x.id).delete())});
    });
    Promise.all(jobs).then(function(){closeDlg();toast("Exemples supprimés")},function(){toast("Suppression partielle")});
    return;
  }
  if(act==="bd-add"){BD.lignes.push({d:"",u:"ens.",q:1});paint();return}
  if(act==="bd-del"){BD.lignes.splice(Number(b.dataset.i),1);
    Object.keys(BD.prix).forEach(function(k){BD.prix[k].splice(Number(b.dataset.i),1)});bdSave();paint();return}
  if(act==="bd-envoye"){
    BD.envoye=!BD.envoye;bdSave();
    if(BD.envoye&&d)maj(d.id,{etat:"devis",journal:journalise(d,"Bordereau de prix envoyé aux entreprises.")});
    paint();return;
  }
  if(act==="bd-copy-vierge"){copier(texteBordereau(d,false),"Bordereau vierge copié");return}
  if(act==="bd-copy-client"){copier(texteBordereau(d,true),"Devis client copié");return}

  if(act==="presta-new"||act==="presta-edit"){
    var p=act==="presta-edit"?DATA.prestataires.filter(function(x){return x.id===id})[0]:null;
    editId=p?p.id:null;
    openDlg(p?"Modifier "+E(p.nom):"Nouvelle entreprise","Le répertoire sert au filtrage automatique par métier et par ville.",
      formPresta(p),
      (p?'<button class="btn ghost" data-act="presta-del" data-id="'+E(p.id)+'">Supprimer</button>':"")
      +'<button class="btn ghost" data-act="dlg-close">Annuler</button><button class="btn" data-act="presta-save">Enregistrer</button>');
    return;
  }
  if(act==="presta-save"){
    if(!db){toast("Base indisponible");return}
    if(!val("p-nom")){toast("Il faut au moins un nom");return}
    var body={nom:val("p-nom"),contact:val("p-contact"),tel:val("p-tel"),email:val("p-email"),
      villes:val("p-villes").split(",").map(function(s){return s.trim()}).filter(Boolean),
      metiers:metiersCoches(),qualite:Number(val("p-q"))||0,reactivite:Number(val("p-r"))||0,
      assurance:val("p-ass"),remarques:val("p-rem")};
    (editId?db.doc("prestataires/"+editId).set(body):db.collection("prestataires").add(body))
      .then(function(){closeDlg();toast("Répertoire mis à jour")})
      .catch(function(e){toast("Écriture refusée : "+(e&&e.code||"erreur"))});
    return;
  }
  if(act==="presta-del"){
    if(db)db.doc("prestataires/"+id).delete().then(function(){closeDlg();toast("Entreprise retirée")});
    return;
  }
  if(act==="note-q"||act==="note-r"){
    if(!db)return;
    var patch={};patch[act==="note-q"?"qualite":"reactivite"]=Number(b.dataset.v);
    db.doc("prestataires/"+id).update(patch).catch(function(e){toast("Note non enregistrée")});
    return;
  }
  if(act==="client-new"||act==="client-edit"){
    var c=act==="client-edit"?DATA.clients.filter(function(x){return x.id===id})[0]:null;
    editId=c?c.id:null;
    openDlg(c?"Modifier "+E(c.nom):"Nouveau client","Un syndic se saisit ici, ses copropriétés s'ajoutent ensuite.",
      formClient(c),
      '<button class="btn ghost" data-act="dlg-close">Annuler</button><button class="btn" data-act="client-save">Enregistrer</button>');
    return;
  }
  if(act==="client-save"){
    if(!db){toast("Base indisponible");return}
    if(!val("c-nom")){toast("Il faut au moins un nom");return}
    var ex=editId?DATA.clients.filter(function(x){return x.id===editId})[0]:null;
    var body={type:val("c-type"),role:val("c-role"),nom:val("c-nom"),contactNom:val("c-contact"),
      tel:val("c-tel"),email:val("c-email"),ville:val("c-ville"),notes:val("c-notes"),copros:(ex&&ex.copros)||[]};
    (editId?db.doc("clients/"+editId).set(body):db.collection("clients").add(body))
      .then(function(){closeDlg();toast("Client enregistré")})
      .catch(function(e){toast("Écriture refusée")});
    return;
  }
  if(act==="copro-new"||act==="copro-edit"){
    var cl=DATA.clients.filter(function(x){return x.id===id})[0];if(!cl)return;
    editId=cl.id;editIx=act==="copro-edit"?Number(b.dataset.v):null;
    var k=editIx==null?null:(cl.copros||[])[editIx];
    openDlg(k?"Modifier la copropriété":"Nouvelle copropriété",E(cl.nom),
      formCopro(k),
      (k?'<button class="btn ghost" data-act="copro-del">Supprimer</button>':"")
      +'<button class="btn ghost" data-act="dlg-close">Annuler</button><button class="btn" data-act="copro-save">Enregistrer</button>');
    return;
  }
  if(act==="copro-save"||act==="copro-del"){
    var cl2=DATA.clients.filter(function(x){return x.id===editId})[0];if(!cl2||!db)return;
    var arr=(cl2.copros||[]).slice();
    if(act==="copro-del")arr.splice(editIx,1);
    else{
      var k2={nom:val("k-nom"),adresse:val("k-adr"),ville:val("k-ville"),lots:Number(val("k-lots"))||0,
        chargeNom:val("k-cn"),chargeTel:val("k-ct"),chargeEmail:val("k-ce")};
      if(!k2.nom){toast("Il faut un nom");return}
      if(editIx==null)arr.push(k2);else arr[editIx]=k2;
    }
    db.doc("clients/"+editId).update({copros:arr}).then(function(){closeDlg();toast("Copropriétés mises à jour")})
      .catch(function(e){toast("Écriture refusée")});
    return;
  }
  if(act==="cloturer"){
    var opts=(d.assignes&&d.assignes.length?d.assignes.map(function(pid){return DATA.prestataires.filter(function(x){return x.id===pid})[0]}).filter(Boolean):DATA.prestataires);
    openDlg("Clôturer "+E(d.ref),"L'intervention rejoint l'historique et la note de l'entreprise est mise à jour.",
      '<div class="field"><label for="i-p">Entreprise intervenue</label><select id="i-p">'
      +opts.map(function(p){return '<option value="'+E(p.id)+'">'+E(p.nom)+'</option>'}).join("")+'</select></div>'
      +'<div class="two">'+fld("i-date","Date","","date")+fld("i-mt","Montant des travaux (€)","","number")+'</div>'
      +'<div class="two">'+fld("i-marge","Votre part (€)","","number")
      +'<div class="field"><label for="i-q">Qualité du travail</label><select id="i-q">'
      +[5,4,3,2,1].map(function(n){return '<option value="'+n+'">'+n+" / 5"+'</option>'}).join("")+'</select></div></div>'
      +'<div class="field"><label for="i-r">Réactivité</label><select id="i-r">'
      +[5,4,3,2,1].map(function(n){return '<option value="'+n+'">'+n+" / 5"+'</option>'}).join("")+'</select></div>'
      +area("i-n","Ce qu'il faut retenir",""),
      '<button class="btn ghost" data-act="dlg-close">Annuler</button><button class="btn" data-act="cloture-save" data-id="'+E(d.id)+'">Clôturer</button>');
    return;
  }
  if(act==="cloture-save"){
    if(!db){toast("Base indisponible");return}
    var pid=val("i-p"),p2=DATA.prestataires.filter(function(x){return x.id===pid})[0]||{};
    var nq=Number(val("i-q")),nr=Number(val("i-r"));
    var nb=DATA.interventions.filter(function(i){return i.prestataireId===pid}).length;
    db.collection("interventions").add({demandeId:d.id,ref:d.ref,prestataireId:pid,
      date:val("i-date")||new Date().toISOString().slice(0,10),
      montant:Number(val("i-mt"))||0,marge:Number(val("i-marge"))||0,
      metier:(d.trades||[])[0]||"",ville:d.ville||"",noteQualite:nq,noteReactivite:nr,notes:val("i-n")});
    db.doc("prestataires/"+pid).update({
      qualite:Math.round(((Number(p2.qualite||0)*nb+nq)/(nb+1))*10)/10,
      reactivite:Math.round(((Number(p2.reactivite||0)*nb+nr)/(nb+1))*10)/10
    }).catch(function(){});
    maj(d.id,{etat:"close",journal:journalise(d,"Clôturée. Intervention par "+(p2.nom||"—")+(val("i-mt")?" pour "+eur(Number(val("i-mt"))):"")+".")});
    closeDlg();toast("Intervention enregistrée");return;
  }
  if(act==="demande-manuelle"){
    openDlg("Saisir une demande","Pour un appel reçu directement, hors QR code.",
      '<div class="two">'+fld("d-nom","Demandeur")+fld("d-tel","Téléphone","","tel")+'</div>'
      +'<div class="two"><div class="field"><label for="d-int">Nature</label><select id="d-int">'
      +Object.keys(INTENT).map(function(k){return '<option value="'+k+'">'+INTENT[k].l+'</option>'}).join("")+'</select></div>'
      +'<div class="field"><label for="d-lieu">Situation</label><select id="d-lieu">'
      +'<option value="privatif">Partie privative</option><option value="commun">Parties communes</option>'
      +'<option value="inconnu">À déterminer</option></select></div></div>'
      +'<div class="field"><label for="d-st">Qualité du demandeur</label><select id="d-st">'
      +Object.keys(STATUTS).map(function(k){return '<option value="'+k+'">'+E(STATUTS[k])+'</option>'}).join("")+'</select></div>'
      +metierBoxes([])
      +'<div class="two">'+fld("d-res","Résidence (facultatif)")+fld("d-ville","Ville")+'</div>'
      +fld("d-adr","Adresse")
      +area("d-desc","Ce qu'il vous a dit"),
      '<button class="btn ghost" data-act="dlg-close">Annuler</button><button class="btn" data-act="demande-save">Créer</button>');
    return;
  }
  if(act==="demande-save"){
    if(!db){toast("Base indisponible");return}
    if(!val("d-nom")){toast("Il faut un nom");return}
    var now=new Date();
    var ref="VD-"+String(now.getFullYear()).slice(2)+String(now.getMonth()+1).padStart(2,"0")+String(now.getDate()).padStart(2,"0")
      +"-"+Math.random().toString(36).slice(2,4).toUpperCase();
    db.collection("demandes").add({ref:ref,recu:now.toISOString(),intent:val("d-int"),trades:metiersCoches(),
      presta:[],lieu:val("d-lieu"),statutDemandeur:val("d-st"),residence:val("d-res"),adresse:val("d-adr"),
      ville:val("d-ville"),nom:val("d-nom"),tel:val("d-tel"),description:val("d-desc"),etat:"nouvelle",
      assignes:[],photos:[],journal:[{t:now.toISOString(),texte:"Demande saisie manuellement après un appel."}]})
      .then(function(){closeDlg();toast("Demande "+ref+" créée")})
      .catch(function(e){toast("Écriture refusée")});
    return;
  }
});
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="q"){flt.q=t.value;clearTimeout(qTimer);qTimer=setTimeout(paint,220);return}
  if(t.dataset.act==="bd-marge"){BD.marge=Number(t.value)||0;bdRefresh();return}
  if(t.dataset.bd){
    var i=Number(t.dataset.i);
    if(t.dataset.bd==="p"){
      var pid=t.dataset.p;BD.prix[pid]=BD.prix[pid]||[];
      BD.prix[pid][i]=t.value===""?null:Number(t.value);
    }else BD.lignes[i][t.dataset.bd]=t.dataset.bd==="q"?Number(t.value):t.value;
    bdRefresh();
  }
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.dataset.flt&&t.tagName==="SELECT"){flt[t.dataset.flt]=t.value;paint();return}
  if(t.dataset.act==="etat"){
    var d=DATA.demandes.filter(function(x){return x.id===t.dataset.id})[0];
    maj(t.dataset.id,{etat:t.value,journal:journalise(d,"État passé à « "+ETATS[t.value].l+" ».")});
  }
});
dlg.addEventListener("click",function(e){if(e.target===dlg)closeDlg()});
</script>
