<title>VD Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<style>
:root{
  --ground:#E9EBEF; --surface:#FFFFFF; --surface-2:#F2F4F7; --sunk:#DFE3EA;
  --ink:#131A24; --ink-2:#414B59; --ink-3:#6C7686;
  --line:#CDD3DC; --line-strong:#A7B0BE;
  --accent:#2E4E77; --accent-soft:#DCE5F1; --accent-ink:#2E4E77;
  --urg:#BC2F26; --urg-soft:#F8DFDB;
  --dep:#8E6206; --dep-soft:#F6E9C9;
  --pro:#20654A; --pro-soft:#D5E9DF;
  --ene:#1D6A82; --ene-soft:#D2E7ED;
  --shadow:0 1px 2px rgba(19,26,36,.06), 0 10px 30px -16px rgba(19,26,36,.28);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0D131B; --surface:#161D26; --surface-2:#1D2630; --sunk:#0A0F16;
  --ink:#E7ECF3; --ink-2:#B2BBC8; --ink-3:#828D9C;
  --line:#28313D; --line-strong:#3E4A59;
  --accent:#84ABD8; --accent-soft:#1C2C41; --accent-ink:#9CBEE4;
  --urg:#EE8F84; --urg-soft:#37201D; --dep:#DCB25C; --dep-soft:#312818; --pro:#78C8A0; --pro-soft:#142B21; --ene:#74BCD4; --ene-soft:#122A33;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ground:#0D131B; --surface:#161D26; --surface-2:#1D2630; --sunk:#0A0F16;
  --ink:#E7ECF3; --ink-2:#B2BBC8; --ink-3:#828D9C;
  --line:#28313D; --line-strong:#3E4A59;
  --accent:#84ABD8; --accent-soft:#1C2C41; --accent-ink:#9CBEE4;
  --urg:#EE8F84; --urg-soft:#37201D; --dep:#DCB25C; --dep-soft:#312818; --pro:#78C8A0; --pro-soft:#142B21; --ene:#74BCD4; --ene-soft:#122A33;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 12px 32px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;letter-spacing:-.012em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;padding:20px 14px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--display);font-weight:700;font-size:1.12rem;letter-spacing:-.02em;padding:0 8px}
.brand span{display:block;font-family:var(--mono);font-size:.58rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:5px;line-height:1.7}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:9px 10px;cursor:pointer;color:var(--ink-2);font-size:.93rem}
.rail nav button:hover{background:var(--surface-2)}
.rail nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.rail nav b{font-family:var(--mono);font-size:.7rem;background:var(--accent);color:var(--surface);border-radius:999px;padding:1px 7px;font-weight:500}
.rail nav button[aria-current="true"] b{background:var(--accent-ink)}
.railfoot{margin-top:auto;font-family:var(--mono);font-size:.65rem;letter-spacing:.06em;color:var(--ink-3);padding:0 8px;line-height:1.5}
.railfoot button{background:none;border:1px solid var(--line-strong);border-radius:5px;color:var(--ink-2);font:inherit;font-size:.68rem;padding:3px 8px;margin-top:6px;cursor:pointer}
.dotlive{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pro);margin-right:6px}
.dotoff{background:var(--urg)}
main{padding:0 clamp(16px,3vw,34px) 60px;min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;display:flex;align-items:center;
  justify-content:flex-end;gap:12px;padding:12px 0;margin-bottom:14px;background:var(--ground);
  border-bottom:1px solid var(--line)}
.tb-info{font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;color:var(--ink-3);
  margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-info.alerte{color:var(--urg)}
@media (max-width:520px){.tb-long{display:none}}
@media (max-width:840px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:12px;overflow-x:auto;padding:12px 16px}
  .rail nav{flex-direction:row;flex:1}
  .rail nav button{white-space:nowrap}
  .railfoot{display:none}
}

.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.head h1{font-size:clamp(1.5rem,3vw,2rem)}
.head p{color:var(--ink-3);font-size:.9rem;margin-top:3px}
.eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.btn{background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:9px 15px;font-family:var(--display);font-weight:600;font-size:.9rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.btn.ghost{background:none;color:var(--ink-2);border:1px solid var(--line-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:.85rem;cursor:pointer;color:var(--ink-2)}
.pill[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.search{flex:1;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.9rem}
select.sel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.87rem}

.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0;cursor:pointer;text-align:left;width:100%;overflow:hidden}
.row:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.row .stripe{background:var(--line-strong)}
.row.u .stripe{background:var(--urg)} .row.d .stripe{background:var(--dep)} .row.p .stripe{background:var(--pro)} .row.e .stripe{background:var(--ene)} .row.a .stripe{background:var(--accent)}
.row .mid{padding:13px 0;min-width:0}
.row .end{padding:13px 16px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;justify-content:center}
.row .t{display:block;font-family:var(--display);font-weight:600;font-size:.98rem;letter-spacing:-.01em}
.row .meta{display:block;font-size:.83rem;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
.ref{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;color:var(--ink-3)}
.tag{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:3px 7px;white-space:nowrap;border:1px solid}
.tag.u{color:var(--urg);border-color:var(--urg);background:var(--urg-soft)}
.tag.d{color:var(--dep);border-color:var(--dep);background:var(--dep-soft)}
.tag.p{color:var(--pro);border-color:var(--pro);background:var(--pro-soft)}
.tag.n{color:var(--ink-3);border-color:var(--line-strong);background:var(--surface-2)}
.tag.a{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
.tag.e{color:var(--ene);border-color:var(--ene);background:var(--ene-soft)}
.bar .bf.e{background:var(--ene)}

.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.95fr);gap:20px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.card+.card{margin-top:14px}
.card h3{font-size:1rem;margin-bottom:3px}
.card .sub{font-size:.82rem;color:var(--ink-3);margin-bottom:12px}
.kv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:.9rem}
.kv:first-of-type{border-top:0}
.kv dt{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.kv dd{margin:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.82rem;color:var(--ink-2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.photo{aspect-ratio:4/3;border:1px solid var(--line);border-radius:5px;background:
  repeating-linear-gradient(135deg,var(--surface-2) 0 9px,var(--sunk) 9px 18px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:var(--ink-3);font-family:var(--mono);font-size:.64rem;text-align:center;padding:6px}
.photo:hover{border-color:var(--accent)}
.photo svg{width:22px;height:22px}
.journal{list-style:none;margin:0;padding:0}
.journal li{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;font-size:.87rem;padding:7px 0;border-top:1px solid var(--line)}
.journal li:first-child{border-top:0}
.journal time{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);padding-top:2px}
.pick{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pick .r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--surface);padding:10px 13px}
.pick .r:hover{background:var(--surface-2)}
.pick .r.loin{background:var(--surface-2)}
.pick label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:11px;align-items:center;cursor:pointer;min-width:0}
.pick .sep{background:var(--surface-2);padding:7px 13px;font-family:var(--mono);font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
@media (max-width:520px){.pick .r{grid-template-columns:minmax(0,1fr) auto}.pick .rate{display:none}}
.nav-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.nav-tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:15px 16px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav-tile:hover{border-color:var(--accent);background:var(--accent-soft)}
.nav-tile b{font-family:var(--display);font-weight:600;font-size:.96rem}
.nav-tile i{font-family:var(--mono);font-style:normal;font-size:.74rem;color:var(--ink-3)}
.crumb{display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:.85rem;color:var(--ink-3);margin-bottom:14px}
.crumb button{background:none;border:0;color:var(--accent-ink);cursor:pointer;font-size:.85rem;padding:0;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(88px,auto) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:.86rem}
.bar .bl{color:var(--ink-2);overflow-wrap:anywhere}
.bar .bt{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .bf{display:block;height:100%;background:var(--accent);border-radius:5px;min-width:3px}
.bar .bf.u{background:var(--urg)} .bar .bf.d{background:var(--dep)} .bar .bf.p{background:var(--pro)}
.bar .bv{font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.qui{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;border-radius:4px;padding:3px 7px;border:1px solid;white-space:nowrap}
.qui.pro{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
.qui.part{color:var(--ink-3);border-color:var(--line-strong);background:var(--surface-2)}
.qui b{width:6px;height:6px;border-radius:1px;background:currentColor;display:block}
.qui.part b{border-radius:50%}
.urgbox{border:1px solid var(--urg);background:var(--urg-soft);border-radius:6px;padding:16px 18px;margin-bottom:16px}
.urgbox h3{color:var(--urg);font-size:1.02rem}
.urgbox p{color:var(--urg);font-size:.86rem;margin-top:4px;line-height:1.45}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.fact+.fact{margin-top:14px}
.fact .tot{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:1px solid var(--line-strong);margin-top:10px;padding-top:11px;font-family:var(--display);font-weight:600}
.fact .tot span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums}
.grille{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 18px;font-size:.86rem}
.grille div{padding:7px 0;border-top:1px solid var(--line)}
.grille div:nth-child(-n+2){border-top:0;font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.grille div:nth-child(even){text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag.ex{color:var(--ink-3);border-color:var(--line-strong);background:var(--surface-2);text-transform:none;letter-spacing:.04em}
.pick input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.pick .nm{font-weight:600;font-family:var(--display);font-size:.92rem}
.pick .ct{font-size:.78rem;color:var(--ink-3);margin-top:1px;overflow-wrap:anywhere}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars button,.stars span{background:none;border:0;padding:0;line-height:1;cursor:pointer;font-size:.85rem;color:var(--line-strong)}
.stars .f{color:var(--dep)}
.stars.ro button{cursor:default}
.rate{display:flex;gap:14px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-3);align-items:center}
.rate b{font-family:var(--mono);font-weight:500;color:var(--ink-2)}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
table.tbl th{font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:400;padding:0 10px 8px;white-space:nowrap}
table.tbl td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.85rem}
.scroll{overflow-x:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.tile dt{font-family:var(--mono);font-size:.63rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.tile dd{margin:4px 0 0;font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile dd small{font-size:.8rem;font-weight:500;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.copro{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--surface-2);margin-top:8px}
.copro h4{font-size:.92rem}
.copro .lots{font-family:var(--mono);font-size:.7rem;color:var(--ink-3);letter-spacing:.05em}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-size:.92rem;width:100%}
.field textarea{min-height:74px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
dialog{border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;max-width:min(620px,94vw);width:100%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,15,22,.55)}
.dlg-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dlg-h h3{font-size:1.05rem}
.dlg-h p{font-size:.82rem;color:var(--ink-3);margin-top:2px}
.dlg-b{padding:18px 20px;max-height:64vh;overflow-y:auto}
.dlg-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 10px 10px;flex-wrap:wrap}
.x{background:none;border:0;font-size:1.25rem;line-height:1;color:var(--ink-3);cursor:pointer;padding:2px 4px}
.mail{font-family:var(--mono);font-size:.8rem;line-height:1.7;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;width:100%;min-height:280px;resize:vertical}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:6px;padding:32px 22px;text-align:center;color:var(--ink-3)}
.empty h3{color:var(--ink);margin-bottom:6px}
.back{background:none;border:0;color:var(--ink-3);font-size:.85rem;cursor:pointer;padding:0;margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:8px;font-size:.88rem;box-shadow:var(--shadow);z-index:9;max-width:92vw}
.bd-in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-size:.85rem;font-family:var(--mono);text-align:right}
.bd-in.txt{text-align:left;font-family:var(--body)}
.warn{background:var(--dep-soft);border:1px solid var(--dep);color:var(--dep);border-radius:6px;padding:11px 14px;font-size:.85rem;line-height:1.5}
.note{font-size:.8rem;color:var(--ink-3);line-height:1.5}
.sect{font-family:var(--mono);font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);border-top:1px solid var(--line);margin:18px 0 12px;padding-top:14px}
.sect:first-child{border-top:0;margin-top:0;padding-top:0}
.sect small{display:block;text-transform:none;letter-spacing:0;font-family:var(--body);font-size:.76rem;color:var(--ink-3);margin-top:3px}
.manque{background:var(--dep-soft);border:1px solid var(--dep);color:var(--dep);border-radius:6px;padding:11px 14px;font-size:.83rem;line-height:1.5;margin-bottom:14px}
.conv{font-family:var(--mono);font-size:.76rem;line-height:1.65;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;width:100%;min-height:340px;resize:vertical}
.depot{display:flex;flex-direction:column;gap:4px;border:1.5px dashed var(--line-strong);border-radius:8px;
  padding:20px 18px;text-align:center;cursor:pointer;background:var(--surface-2);margin-top:12px}
.depot:hover,.depot.sur{border-color:var(--accent);background:var(--accent-soft)}
.depot strong{font-family:var(--display);font-size:.96rem}
.depot span{font-size:.8rem;color:var(--ink-3);line-height:1.45}
#printable{display:none}
@media print{
  body>.shell,body>dialog{display:none!important}
  #printable{display:block!important;background:#fff;color:#000;padding:0;margin:0}
  #printable pre{white-space:pre-wrap;font-family:Georgia,"Times New Roman",serif;font-size:10.5pt;line-height:1.55;margin:0}

var GRILLE=[
 {max:300,forfait:30,l:"Jusqu'à 300 €",c:"30 € HT"},
 {max:750,forfait:50,l:"301 € à 750 €",c:"50 € HT"},
 {max:1500,forfait:100,l:"751 € à 1 500 €",c:"100 € HT"},
 {max:5000,taux:0.10,l:"1 501 € à 5 000 €",c:"10 % du montant HT"},
 {max:20000,taux:0.08,l:"5 001 € à 20 000 €",c:"8 % du montant HT"},
 {max:50000,taux:0.06,l:"20 001 € à 50 000 €",c:"6 % du montant HT"},
 {max:Infinity,accord:true,l:"Plus de 50 000 €",c:"Sur accord préalable"}
];
function commission(m){
  m=Number(m)||0;
  if(m<=0)return {v:0,base:"—",accord:false};
  for(var i=0;i<GRILLE.length;i++){
    var g=GRILLE[i];
    if(m<=g.max){
      if(g.accord)return {v:null,base:"accord préalable",accord:true};
      return {v:g.forfait!=null?g.forfait:m*g.taux,base:g.forfait!=null?"forfait "+g.forfait+" €":(g.taux*100)+" %",accord:false};
    }
  }
  return {v:0,base:"—",accord:false};
}
function taux(com,vol){
  if(!vol)return "—";
  return (Math.round(com/vol*1000)/10).toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:1})+" %";
}
var TYPES_DOC=[
 {id:"decennale",l:"Assurance décennale",req:1,sub:"Garantie décennale en cours de validité, avec les activités garanties.",

 {id:"urssaf",l:"Vigilance URSSAF",req:1,sub:"Attestation de vigilance, à renouveler tous les six mois.",

 {id:"honneur",l:"Travail dissimulé",req:1,sub:"Attestation sur l'honneur de non-emploi de travailleurs étrangers sans titre et de lutte contre le travail dissimulé.",

 {id:"kbis",l:"Kbis ou avis SIRENE",req:1,sub:"Moins de trois mois. C'est lui qui remplit le mieux la fiche.",

       siren:"siren",activites:"activite",representant:"repnom",qualiteRepresentant:"repqualite"}},
 {id:"qualif",l:"Qualifications",req:0,sub:"RGE, Qualibat, Qualifelec, attestation fluides frigorigènes, habilitations.",
  map:{certifications:"certifs"}},
 {id:"rib",l:"RIB",req:0,sub:"Pour le règlement des situations et le rapprochement des factures.",map:{}},
 {id:"autre",l:"Autres pièces",req:0,sub:"Convention signée, plaquette, références, tout le reste.",map:{}}
];
function typeDoc(id){return TYPES_DOC.filter(function(t){return t.id===id})[0]||TYPES_DOC[7]}
function docsDe(pid,type){
  return DATA.documents.filter(function(d){return d.prestataireId===pid&&(!type||d.type===type)})
    .sort(function(a,b){return (b.ajouteLe||"").localeCompare(a.ajouteLe||"")});
}
function dateFr(v){
  if(!v)return null;
  var m=String(v).match(/(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{2,4})/);
  if(m){var an=m[3].length===2?"20"+m[3]:m[3];return new Date(an+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0")+"T12:00:00")}
  var d=new Date(v);return isNaN(d)?null:d;
}
function validite(doc){
  var f=dateFr(doc.dateFin);
  if(!f)return {c:"n",l:"sans échéance",jours:null};
  var j=Math.round((f-new Date())/86400000);
  if(j<0)return {c:"u",l:"expirée depuis "+(-j)+" j",jours:j};
  if(j<=60)return {c:"d",l:"expire dans "+j+" j",jours:j};
  return {c:"p",l:"valable jusqu'au "+f.toLocaleDateString("fr-FR"),jours:j};
}
function dossier(p){
  var manque=[],alerte=[];
  TYPES_DOC.filter(function(t){return t.req}).forEach(function(t){
    var l=docsDe(p.id,t.id);
    if(!l.length)manque.push(t.l);
    else{
      var v=validite(l[0]);
      if(v.jours!==null&&v.jours<0)alerte.push(t.l+" expirée");
      else if(v.jours!==null&&v.jours<=60)alerte.push(t.l+" à renouveler");
    }
  });
  return {manque:manque,alerte:alerte,ok:!manque.length&&!alerte.length};
}
function dossierTag(p){
  var d=dossier(p);

  if(d.alerte.length)return '<span class="tag u">'+E(d.alerte[0])+'</span>';
  return '<span class="tag d">'+d.manque.length+' pièce(s) manquante(s)</span>';
}

function moisLong(m){
  if(!m)return "";
  var d=new Date(m+"-01T12:00:00");
  return isNaN(d)?m:d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
}
function dansPeriode(iso,per){
  if(per==="tout")return true;
  if(!iso)return false;
  var d=new Date(iso);if(isNaN(d))return false;
  var now=new Date(),a;
  if(per==="jour")return d.toDateString()===now.toDateString();
  if(per==="semaine"){a=new Date(now);a.setDate(now.getDate()-6);a.setHours(0,0,0,0);return d>=a}
  if(per==="mois")return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
  if(per==="trimestre"){a=new Date(now);a.setDate(now.getDate()-89);a.setHours(0,0,0,0);return d>=a}
  return true;
}
function joursPeriode(per){
  var now=new Date();
  if(per==="jour")return 1;
  if(per==="semaine")return 7;
  if(per==="mois")return now.getDate();
  if(per==="trimestre")return 90;
  var d=DATA.interventions.map(function(i){return i.date}).filter(Boolean).sort();
  if(!d.length)return 1;
  return Math.max(1,Math.round((now-new Date(d[0]))/86400000)+1);
}

      +'<span class="bv">'+E(i.d!=null?i.d:i.v)+'</span></div>';
  }).join("")+'</div>';
}

/* ---------- sauvegarde et restauration ---------- */
var COLLS=["demandes","prestataires","clients","interventions","bordereaux","documents","residences","reglages"];
function derniereSauvegarde(){
  try{return localStorage.getItem("vd-sauvegarde")||""}catch(e){return ""}
}

}

}

  COLLS.forEach(function(c){o.collections[c]=(DATA[c]||[]).map(function(x){return x})});
  return o;
}
function enregistrerFichier(nom,contenu,type){
  var blob=new Blob([contenu],{type:type||"application/json;charset=utf-8"});
  return (window.claude&&window.claude.use?window.claude.use("downloads"):Promise.resolve(null))
    .then(function(dl){
      if(dl)return dl.save({filename:nom,data:blob}).then(function(){return true});
      var w=window.open("","_blank");
      if(w){
        w.document.write('<pre style="white-space:pre-wrap;font:12px monospace">'
          +String(contenu).replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</pre>');
        w.document.close();
        return true;
      }
      return false;
    });
}
function versCSV(lignes,colonnes){
  function q(v){
    if(v==null)return "";
    if(typeof v==="object")v=JSON.stringify(v);
    v=String(v).replace(/"/g,'""');
    return '"'+v+'"';
  }
  var out=[colonnes.map(q).join(";")];
  lignes.forEach(function(l){out.push(colonnes.map(function(c){return q(l[c])}).join(";"))});
  return "\ufeff"+out.join("\r\n");

function aides(d){
  var r=[],proprio=(d.occupation==="occupant"||d.occupation==="bailleur"),
      vieux=(d.anciennete==="plus15"||d.anciennete==="entre"),g=d.gestes||[];
  if(d.devisSigne==="Oui")r.push("Devis déjà signé : la plupart des aides se demandent avant. Point bloquant à traiter en premier.");
  if(d.occupation==="locataire")r.push("Locataire : le dossier doit passer par le propriétaire.");
  if(d.occupation==="syndicat")r.push("Parties communes : dossier au nom du syndicat, vote en assemblée générale, dispositif propre aux copropriétés.");
  if(d.anciennete==="moins2")r.push("Logement de moins de deux ans : principales aides à la rénovation non applicables.");
  if(d.usage==="secondaire")r.push("Résidence secondaire : aide principale de l'État exclue, restent les certificats d'économies d'énergie.");
  if(proprio&&vieux&&d.usage!=="secondaire")r.push("Profil éligible à l'aide principale de l'État, sous réserve des barèmes et d'une entreprise RGE.");
  if(vieux)r.push("Certificats d'économies d'énergie : cumulables, tous revenus.");
  if((d.chauffage==="fioul"||d.chauffage==="gaz")&&(g.indexOf("pac_ae")>=0||g.indexOf("granules")>=0))
    r.push("Sortie d'énergie fossile vers pompe à chaleur ou granulés : cas le mieux aidé, primes majorées.");
  if(d.revenus==="r1"||d.revenus==="r2")r.push("Revenus modestes : taux majorés et avance de frais possible.");
  if(g.length>=2||g.indexOf("ampleur")>=0||d.dpe==="fg")
    r.push("Rénovation d'ampleur : audit et accompagnateur obligatoires, mission de coordination complète.");
  if(vieux)r.push("TVA réduite, et prêt à taux zéro en résidence principale.");
  r.push("Aides locales région, département, commune : à vérifier au cas par cas.");
  return r;
}

function coll(name){
  return db.collection(name).onSnapshot(function(snap){
    DATA[name]=snap.docs.map(function(doc){var o=Object.assign({},doc.data()||{});o.id=doc.id;return o});
    ready=true;paint();
  },function(e){
    ready=true;DATA[name]=[];paint();
    console.warn("db "+name,e&&e.code);
  });
}
function attendre(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function boot(){
  etatCx="attente";cxErr="";db=null;ready=false;paint();
  /* le moteur de base est injecté par la plateforme, parfois après ce script :
     on l'attend jusqu'à 12 s au lieu de le tester une seule fois. */
  var c=null;
  for(var i=0;i<48;i++){
    if(window.claude&&typeof window.claude.use==="function"){c=window.claude;break}
    await attendre(250);
  }
  if(!c){etatCx="absent";ready=true;paint();return}
  try{db=await c.use("db")}catch(e){cxErr=(e&&e.code)||"erreur";db=null}
  if(!db){etatCx=cxErr?"erreur":"refuse";ready=true;paint();return}
  etatCx="ok";
  try{Object.keys(DATA).forEach(coll)}
  catch(e){etatCx="erreur";cxErr=(e&&e.code)||"abonnement impossible"}
  paint();
}

function vFacturation(){
  var mois={};

  var liste=Object.keys(mois).sort().reverse();
  if(!flt.mois||liste.indexOf(flt.mois)<0)flt.mois=liste[0]||moisDe(new Date().toISOString());
  var itv=DATA.interventions.filter(function(i){return moisDe(i.date)===flt.mois});

  var h='<div class="head"><div><p class="eyebrow">Fin de mois</p><h1>Factures de commissions</h1>'
    +'<p>Une facture par entreprise, ligne par intervention, selon la grille d\'apport d\'affaires.</p></div>'
    +'<div class="actions" style="margin:0"><button class="btn ghost" data-act="fact-copy-all">Copier toutes les factures</button></div></div>';
  h+='<div class="bar"><select class="sel" data-flt="mois">'
    +(liste.length?liste.map(function(m){return '<option value="'+E(m)+'"'+(flt.mois===m?" selected":"")+'>'+E(moisLong(m))+'</option>'}).join("")
      :'<option>'+E(moisLong(flt.mois))+'</option>')
    +'</select><span class="note">'+itv.length+' intervention(s) ce mois-ci</span></div>';

  var parEnt={};
  itv.forEach(function(i){(parEnt[i.prestataireId]=parEnt[i.prestataireId]||[]).push(i)});
  var ids=Object.keys(parEnt);
  if(!ids.length)h+='<div class="empty"><h3>Aucune intervention ce mois-ci</h3><p>Clôturez une demande pour qu\'elle apparaisse ici.</p></div>';
  ids.forEach(function(pid){
    var p=DATA.prestataires.filter(function(x){return x.id===pid})[0]||{nom:"Entreprise inconnue"};
    var lignes=parEnt[pid].slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"")});
    var tot=0,accord=0,volEnt=0;
    h+='<div class="fact"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap">'
      +'<div><h3>'+E(p.nom)+'</h3><p class="sub">'+E(p.contact||"")+(p.email?' · '+E(p.email):"")+'</p></div>'
      +'<button class="btn sm ghost" data-act="fact-copy" data-id="'+E(pid)+'">Copier cette facture</button></div>';
    h+='<div class="scroll"><table class="tbl"><thead><tr><th>Date</th><th>Réf</th><th>Client</th><th>Ville</th>'
      +'<th class="num">Travaux HT</th><th class="num">Base</th><th class="num">Commission HT</th></tr></thead><tbody>';
    lignes.forEach(function(i){
      var c=commission(i.montant);
      if(c.accord)accord++;else tot+=c.v||0;
      volEnt+=Number(i.montant)||0;
      var d=DATA.demandes.filter(function(x){return x.id===i.demandeId})[0];
      h+='<tr><td>'+E(jour(i.date))+'</td><td>'+E(i.ref||(d&&d.ref)||"—")+'</td>'
        +'<td>'+E((d&&d.nom)||i.client||"—")+'</td><td>'+E(i.ville||(d&&d.ville)||"—")+'</td>'
        +'<td class="num">'+eur(i.montant||0)+'</td><td class="num">'+E(c.base)+'</td>'
        +'<td class="num">'+(c.accord?"à convenir":eur(c.v||0))+'</td></tr>';
    });
    h+='</tbody></table></div>';
    h+='<div class="tot"><span>Total commissions HT</span><span>'+eur(tot)+'</span></div>';
    h+='<div class="tot" style="border-top:0;padding-top:4px;font-weight:400;font-family:var(--body);font-size:.86rem;color:var(--ink-3)">'
      +'<span>Volume de travaux confié · part prélevée</span><span>'+eur(volEnt)+' · '+E(taux(tot,volEnt))+'</span></div>';
    h+='<div class="tot" style="border-top:0;padding-top:4px;font-weight:400;font-family:var(--body);font-size:.86rem;color:var(--ink-3)">'
      +'<span>TVA 20 % · total TTC</span><span>'+eur(tot*0.2)+' · '+eur(tot*1.2)+'</span></div>';
    if(accord)h+='<p class="note" style="margin-top:8px">'+accord+' ligne(s) au-delà de 50 000 € à convenir de gré à gré, hors total.</p>';
    h+='</div>';
  });

  h+='<div class="card" style="margin-top:22px"><h3>Grille d\'apport d\'affaires</h3>'
    +'<p class="sub">Appliquée automatiquement au montant HT facturé au client par l\'entreprise.</p>'
    +'<div class="grille"><div>Montant HT facturé au client</div><div>Commission d\'apport</div>'
    +GRILLE.map(function(g){return '<div>'+E(g.l)+'</div><div>'+E(g.c)+'</div>'}).join("")+'</div></div>';
  return h;
}
function texteFacture(pid){
  var p=DATA.prestataires.filter(function(x){return x.id===pid})[0]||{nom:"—"};
  var lignes=DATA.interventions.filter(function(i){return i.prestataireId===pid&&moisDe(i.date)===flt.mois})
    .sort(function(a,b){return (a.date||"").localeCompare(b.date||"")});
  var L=[],tot=0,vol=0;
  L.push("VD SERVICES — FACTURE DE COMMISSIONS D'APPORT D'AFFAIRES");
  L.push("Période : "+moisLong(flt.mois));
  L.push("");
  L.push("Émetteur : VD SERVICES — Valentin Dupuy");
  L.push("Consultation, pilotage, coordination et assistance");
  L.push("Mandelieu-la-Napoule — secteur Fréjus / Nice");
  L.push("Destinataire : "+p.nom+(p.contact?" — "+p.contact:""));
  L.push("");
  L.push("Date | Référence | Client | Travaux HT | Base | Commission HT");
  lignes.forEach(function(i){
    var c=commission(i.montant);
    var d=DATA.demandes.filter(function(x){return x.id===i.demandeId})[0];
    if(!c.accord)tot+=c.v||0;
    vol+=Number(i.montant)||0;
    L.push(jour(i.date)+" | "+(i.ref||(d&&d.ref)||"-")+" | "+((d&&d.nom)||"-")+" | "+eur(i.montant||0)
      +" | "+c.base+" | "+(c.accord?"à convenir":eur(c.v||0)));
  });
  L.push("");
  L.push("Volume de travaux confié : "+eur(vol));
  L.push("Total commissions HT : "+eur(tot)+"  ("+taux(tot,vol)+" du volume)");
  L.push("TVA 20 % : "+eur(tot*0.2));
  L.push("Total TTC : "+eur(tot*1.2));
  L.push("");
  L.push("Règlement à 30 jours. Grille d'apport d'affaires en vigueur :");
  GRILLE.forEach(function(g){L.push("  "+g.l+" : "+g.c)});
  return L.join("\n");
}

      +'</div>';

function pickRow(p,d,loin){
  var on=(d.assignes||[]).indexOf(p.id)>=0;
  return '<div class="r'+(loin?" loin":"")+'">'
    +'<label><input type="checkbox" data-pick="'+E(p.id)+'"'+(on?" checked":"")+'>'
    +'<span><span class="nm">'+E(p.nom)+(p.exemple?' <span class="tag ex">exemple</span>':"")+'</span>'
    +'<span class="ct">'+E((p.metiers||[]).map(function(m){return MET[m]||m}).join(", "))+' · '+E((p.villes||[]).join(", "))+'</span></span></label>'
    +'<span class="rate">'+stars(moy(p))+'</span>'
    +(p.tel?'<a class="btn sm ghost" href="tel:'+E(tel(p.tel))+'">Appeler</a>':'<span class="note">pas de n°</span>')
    +'</div>';
}
function tel(t){return String(t||"").replace(/[^0-9+]/g,"")}
function kv(k,v){return '<div class="kv"><dt>'+k+'</dt><dd>'+v+'</dd></div>'}
function candidats(d){
  var mets=d.trades||[],ville=(d.ville||"").toLowerCase();
  return DATA.prestataires.filter(function(p){
    return (p.metiers||[]).some(function(x){return mets.indexOf(x)>=0});
  }).map(function(p){
    p.local=!!ville&&(p.villes||[]).some(function(x){return x.toLowerCase().indexOf(ville)>=0||ville.indexOf(x.toLowerCase())>=0});
    return p;
  }).sort(function(a,b){return (b.local?1:0)-(a.local?1:0)||moy(b)-moy(a)});
}

/* ---------- vue : bordereau de prix ---------- */
function vBordereau(){
  var d=DATA.demandes.filter(function(x){return x.id===route.id})[0];
  if(!d)return emptyBlock();
  if(!BD){
    var ex=DATA.bordereaux.filter(function(b){return b.id===d.id})[0];
    BD=ex?JSON.parse(JSON.stringify(ex)):{id:d.id,marge:12,envoye:false,prix:{},
      lignes:(prestaLabels(d).length?prestaLabels(d):["Prestation à décrire"]).map(function(l){return {d:l,u:"ens.",q:1}})};
    BD.prix=BD.prix||{};BD.lignes=BD.lignes||[];
  }
  var ents=(d.assignes||[]).map(function(id){return DATA.prestataires.filter(function(p){return p.id===id})[0]}).filter(Boolean);
  var h='<button class="back" data-nav="demande" data-id="'+E(d.id)+'">← Retour à la demande</button>';
  h+='<div class="head"><div><p class="eyebrow">'+E(d.ref)+' · '+E(d.nom)+' · '+E([d.residence,d.ville].filter(Boolean).join(", "))+'</p>'
    +'<h1>Bordereau de prix</h1><p>Les entreprises chiffrent poste par poste. Vous comparez, vous appliquez votre marge, vous envoyez au client.</p></div>'
    +'<div class="chips">'
    +'<button class="btn ghost sm" data-act="bd-copy-vierge">Copier le bordereau vierge</button>'
    +'<button class="btn sm" data-act="bd-copy-client">Copier le devis client</button></div></div>';
  if(!ents.length)h+='<div class="warn">Aucune entreprise sélectionnée sur cette demande. Revenez à la fiche et cochez celles à consulter : leurs colonnes de prix apparaîtront ici.</div><div style="height:14px"></div>';
  h+='<div class="card"><div class="scroll"><table class="tbl"><thead><tr>'
    +'<th style="width:34%">Désignation</th><th class="num">U</th><th class="num">Qté</th>'
    +ents.map(function(p){return '<th class="num">'+E(p.nom)+'</th>'}).join("")
    +'<th class="num">Retenu</th><th class="num">Prix client</th><th></th></tr></thead><tbody id="bdbody">'
    +BD.lignes.map(function(l,i){return bdRow(l,i,ents)}).join("")
    +'</tbody><tfoot><tr>'
    +'<td colspan="3" style="font-family:var(--display);font-weight:600">Total</td>'
    +ents.map(function(p){return '<td class="num" id="tot-'+E(p.id)+'">'+eur(totEnt(p.id))+'</td>'}).join("")
    +'<td class="num" id="tot-ret">'+eur(totRetenu())+'</td>'
    +'<td class="num" id="tot-cli" style="font-weight:600">'+eur(totClient())+'</td><td></td></tr></tfoot></table></div>';
  h+='<div class="chips" style="margin-top:16px;align-items:center">'
    +'<button class="btn sm ghost" data-act="bd-add">+ Ajouter une ligne</button>'
    +'<span class="note">Marge appliquée au prix client</span>'
    +'<input class="bd-in" id="marge" style="width:80px" type="number" min="0" max="60" step="1" value="'+E(BD.marge)+'" data-act="bd-marge"><span class="note">%</span>'
    +'<button class="btn sm ghost" data-act="bd-envoye">'+(BD.envoye?"Marquer comme non envoyé":"Marquer comme envoyé aux entreprises")+'</button>'
    +'</div>';
  h+='<p class="note" style="margin-top:12px">Le « retenu » est le moins-disant des prix saisis. Le prix client est le retenu majoré de votre marge. Le client ne voit jamais les colonnes des entreprises.</p></div>';
  return h;
}
function bdRow(l,i,ents){
  return '<tr data-i="'+i+'">'
    +'<td><input class="bd-in txt" data-bd="d" data-i="'+i+'" value="'+E(l.d)+'"></td>'
    +'<td class="num"><input class="bd-in" style="width:62px" data-bd="u" data-i="'+i+'" value="'+E(l.u)+'"></td>'
    +'<td class="num"><input class="bd-in" style="width:62px" type="number" step="0.5" min="0" data-bd="q" data-i="'+i+'" value="'+E(l.q)+'"></td>'
    +ents.map(function(p){
      var v=(BD.prix[p.id]||[])[i];
      return '<td class="num"><input class="bd-in" style="width:86px" type="number" step="1" min="0" placeholder="—" data-bd="p" data-p="'+E(p.id)+'" data-i="'+i+'" value="'+(v==null?"":E(v))+'"></td>';
    }).join("")
    +'<td class="num" id="ret-'+i+'">'+(retenu(i)==null?"—":eur(retenu(i)*Number(l.q||0)))+'</td>'
    +'<td class="num" id="cli-'+i+'">'+(retenu(i)==null?"—":eur(retenu(i)*Number(l.q||0)*(1+Number(BD.marge||0)/100)))+'</td>'
    +'<td><button class="x" data-act="bd-del" data-i="'+i+'" aria-label="Supprimer la ligne">×</button></td></tr>';
}
function retenu(i){
  var vals=Object.keys(BD.prix).map(function(pid){return Number((BD.prix[pid]||[])[i])}).filter(function(v){return v>0});
  return vals.length?Math.min.apply(null,vals):null;
}
function totEnt(pid){
  return BD.lignes.reduce(function(s,l,i){var v=Number((BD.prix[pid]||[])[i])||0;return s+v*Number(l.q||0)},0);
}
function totRetenu(){return BD.lignes.reduce(function(s,l,i){var r=retenu(i);return s+(r?r*Number(l.q||0):0)},0)}
function totClient(){return totRetenu()*(1+Number(BD.marge||0)/100)}
function bdRefresh(){
  var d=DATA.demandes.filter(function(x){return x.id===route.id})[0]||{};
  var ents=(d.assignes||[]).map(function(id){return DATA.prestataires.filter(function(p){return p.id===id})[0]}).filter(Boolean);
  BD.lignes.forEach(function(l,i){
    var r=retenu(i),q=Number(l.q||0);
    var a=document.getElementById("ret-"+i),b=document.getElementById("cli-"+i);
    if(a)a.textContent=r==null?"—":eur(r*q);
    if(b)b.textContent=r==null?"—":eur(r*q*(1+Number(BD.marge||0)/100));
  });
  ents.forEach(function(p){var e=document.getElementById("tot-"+p.id);if(e)e.textContent=eur(totEnt(p.id))});
  var tr=document.getElementById("tot-ret"),tc=document.getElementById("tot-cli");
  if(tr)tr.textContent=eur(totRetenu());
  if(tc)tc.textContent=eur(totClient());
  clearTimeout(bdTimer);bdTimer=setTimeout(bdSave,700);
}
function bdSave(){
  if(!db||!BD)return;
  var b=JSON.parse(JSON.stringify(BD));delete b.id;
  db.doc("bordereaux/"+BD.id).set(b).catch(function(e){toast("Enregistrement impossible : "+(e&&e.code||"erreur"))});
}

/* ---------- lecture des documents ---------- */
function chargerPdfJs(){
  return new Promise(function(res,rej){
    if(window.pdfjsLib)return res(window.pdfjsLib);
    var sc=document.createElement("script");
    sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    sc.onload=function(){
      if(!window.pdfjsLib)return rej(new Error("pdf.js indisponible"));
      try{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}catch(e){}
      res(window.pdfjsLib);
    };
    sc.onerror=function(){rej(new Error("lecteur PDF non chargé"))};
    document.head.appendChild(sc);
  });
}
async function pdfTexte(file){
  var lib=await chargerPdfJs();
  var buf=await file.arrayBuffer();
  var pdf=await lib.getDocument({data:buf}).promise;
  var out=[];
  for(var i=1;i<=Math.min(pdf.numPages,6);i++){
    var pg=await pdf.getPage(i);
    var tc=await pg.getTextContent();
    out.push(tc.items.map(function(it){return it.str}).join(" "));
  }
  return out.join("\n").replace(/\s+/g," ").trim();
}
async function analyser(type,file){
  var sp=null;
  try{sp=window.claude&&window.claude.use?await window.claude.use("sample"):null}catch(e){sp=null}
  if(!sp)throw new Error("la lecture automatique n'est pas disponible sur cette page");
  var forme='{"raisonSociale":"","formeSociale":"","capital":"","adresse":"","villeRcs":"","siren":"",'
    +'"activites":"","representant":"","qualiteRepresentant":"","assureur":"","numeroPolice":"",'
    +'"dateDebut":"","dateFin":"","certifications":"","observations":""}';
  var consigne="Tu lis une pièce administrative d'une entreprise du bâtiment en France, de type : "+typeDoc(type).l+". "
    +"Renvoie UNIQUEMENT un objet JSON de cette forme exacte, sans texte autour : "+forme+" "
    +"Règles : laisse la chaîne vide pour tout champ qui ne figure pas explicitement dans le document. "
    +"N'invente jamais une valeur. Les dates au format JJ/MM/AAAA. "
    +"dateFin est la date de fin de validité de l'attestation ou du contrat. "
    +"activites résume les activités garanties ou déclarées, en une ligne. "
    +"observations signale une réserve, une exclusion ou une mention importante, sinon chaîne vide.";
  if(/^image\//.test(file.type)){
    var lim=null;try{lim=await sp.limits()}catch(e){}
    if(!lim||!lim.images)throw new Error("cette page ne peut pas envoyer d'images à Claude");
    return await sp.json(consigne,{images:file,modelTier:"default"});
  }
  var txt=await pdfTexte(file);
  if(txt.length<40)throw new Error("ce PDF ne contient pas de texte, il est probablement scanné : déposez une photo de la pièce");
  return await sp.json(consigne+"\n\nTexte du document :\n"+txt.slice(0,40000),{modelTier:"default"});
}

  for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*16777619)>>>0}

/* ---------- copropriétés d'un syndic ---------- */
function coprosDe(clientId){
  var c=DATA.clients.filter(function(x){return x.id===clientId})[0];
  if(!c)return [];
  var out=(c.copros||[]).map(function(k){
    var r=DATA.residences.filter(function(x){return x.nom===k.nom||x.code===slug(k.nom)})[0]||{};
    return {key:r.code||slug(k.nom),nom:k.nom,adresse:k.adresse||r.adresse||"",ville:k.ville||r.ville||c.ville||"",
      lots:Number(k.lots||r.lots)||0,chargeNom:k.chargeNom||"",chargeTel:k.chargeTel||"",chargeEmail:k.chargeEmail||"",
      client:c.nom,clientId:c.id};
  });
  DATA.residences.forEach(function(r){
    if(r.client!==c.nom)return;
    if(out.some(function(o){return o.key===r.code||o.nom===r.nom}))return;
    out.push({key:r.code||slug(r.nom),nom:r.nom,adresse:r.adresse||"",ville:r.ville||"",
      lots:Number(r.lots)||0,chargeNom:"",chargeTel:"",chargeEmail:"",client:c.nom,clientId:c.id});
  });
  return out.sort(function(a,b){return String(a.nom).localeCompare(String(b.nom))});
}
function demandesCopro(k){
  return DATA.demandes.filter(function(d){
    return (d.resCode&&d.resCode===k.key)||(d.residence&&d.residence===k.nom);
  }).sort(function(a,b){return String(b.recu||"").localeCompare(String(a.recu||""))});
}
function demandesHorsCopro(cid){
  var vus={};
  coprosDe(cid).forEach(function(k){demandesCopro(k).forEach(function(d){vus[d.id]=1})});
  return DATA.demandes.filter(function(d){return d.clientId===cid&&!vus[d.id]})
    .sort(function(a,b){return String(b.recu||"").localeCompare(String(a.recu||""))});
}
function toutesDemandesSyndic(cid){
  var l=[],vus={};
  coprosDe(cid).forEach(function(k){demandesCopro(k).forEach(function(d){if(!vus[d.id]){vus[d.id]=1;l.push(d)}})});
  demandesHorsCopro(cid).forEach(function(d){if(!vus[d.id]){vus[d.id]=1;l.push(d)}});
  return l.sort(function(a,b){return String(b.recu||"").localeCompare(String(a.recu||""))});
}
function aMoi(d){
  if(!SESS.clientId)return false;
  if(d.clientId===SESS.clientId)return true;
  return coprosDe(SESS.clientId).some(function(k){
    return (d.resCode&&d.resCode===k.key)||(d.residence&&d.residence===k.nom);
  });
}

  if(!b||!b.lignes||!b.lignes.length)return 0;
  var prix=b.prix||{},s=0;
  b.lignes.forEach(function(l,i){
    var vals=Object.keys(prix).map(function(pid){return Number((prix[pid]||[])[i])}).filter(function(v){return v>0});

function copier(txt,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast(msg||"Copié")},function(){fallback(txt,msg)});
  }else fallback(txt,msg);
}
function fallback(txt,msg){
  var t=document.createElement("textarea");t.value=txt;t.style.position="fixed";t.style.opacity="0";
  document.body.appendChild(t);t.select();
  try{document.execCommand("copy");toast(msg||"Copié")}catch(e){toast("Sélectionnez le texte puis copiez-le")}
  t.remove();
}

  var j=(d.journal||[]).slice();

function accuseReception(d){

  L.push("Ce que je fais pour vous : je cherche l'entreprise qui convient parmi celles de mon réseau, toutes assurées et vérifiées, je vous transmets le devis et je suis l'intervention jusqu'à la fin. Vous n'avez qu'un seul interlocuteur.");

    L.push("Merci de compléter la colonne prix unitaire et de me retourner le document.");
    L.push("Les quantités sont indicatives, à vérifier sur place.");
  }
  return L.join("\n");
}

  }
  if(act==="voir-syndic"){
    SESS={role:"syndic",clientId:id,apercu:true};sessSave();selK=null;navigate("syndic");return;

      +'<div class="field"><label for="ar-sms">Version SMS</label><textarea class="fld" id="ar-sms" rows="3">'+E(ac.sms)+'</textarea></div>'
      +'<p class="note">Tant que le site public n\'envoie rien, c\'est vous qui l\'envoyez. Le texte est identique à celui que l\'automatisation enverra.</p>',
      '<button class="btn ghost" data-act="ar-sms">Copier le SMS</button>'
      +'<button class="btn ghost" data-act="ar-copy">Copier le mail</button>'
      +'<button class="btn" data-act="ar-envoye" data-id="'+E(d.id)+'">Marquer comme envoyé</button>');

  if(act==="ar-sms"){copier(val("ar-sms"),"SMS copié");return}

    maj(d.id,{journal:journalise(d,"Accusé de réception envoyé au demandeur.")});

  }
  if(act==="sauv-json"){

      '<div class="two">'+fld("d-nom","Demandeur")+fld("d-tel","Téléphone","","tel")+'</div>'
      +'<div class="two"><div class="field"><label for="d-int">Nature</label><select id="d-int">'
      +Object.keys(INTENT).map(function(k){return '<option value="'+k+'">'+INTENT[k].l+'</option>'}).join("")+'</select></div>'
      +'<div class="field"><label for="d-lieu">Situation</label><select id="d-lieu">'
      +'<option value="privatif">Partie privative</option><option value="commun">Parties communes</option>'
      +'<option value="inconnu">À déterminer</option></select></div></div>'
      +'<div class="field"><label for="d-st">Qualité du demandeur</label><select id="d-st">'
      +Object.keys(STATUTS).map(function(k){return '<option value="'+k+'">'+E(STATUTS[k])+'</option>'}).join("")+'</select></div>'
      +metierBoxes([])
      +'<div class="two">'+fld("d-res","Résidence (facultatif)")+fld("d-ville","Ville")+'</div>'
      +fld("d-adr","Adresse")
      +area("d-desc","Ce qu'il vous a dit"),
      '<button class="btn ghost" data-act="dlg-close">Annuler</button><button class="btn" data-act="demande-save">Créer</button>');
    return;
  }
  if(act==="demande-save"){
    if(!db){toast("Base indisponible");return}
    if(!val("d-nom")){toast("Il faut un nom");return}
    var now=new Date();
    var ref="VD-"+String(now.getFullYear()).slice(2)+String(now.getMonth()+1).padStart(2,"0")+String(now.getDate()).padStart(2,"0")
      +"-"+Math.random().toString(36).slice(2,4).toUpperCase();
    db.collection("demandes").add({ref:ref,recu:now.toISOString(),intent:val("d-int"),trades:metiersCoches(),
      presta:[],lieu:val("d-lieu"),statutDemandeur:val("d-st"),residence:val("d-res"),adresse:val("d-adr"),
      ville:val("d-ville"),nom:val("d-nom"),tel:val("d-tel"),description:val("d-desc"),etat:"nouvelle",
      assignes:[],photos:[],journal:[{t:now.toISOString(),texte:"Demande saisie manuellement après un appel."}]})
      .then(function(){closeDlg();toast("Demande "+ref+" créée")})
      .catch(function(e){toast("Écriture refusée")});
    return;
  }
});
function ouvrirAppliquer(doc){
  var pr=DATA.prestataires.filter(function(x){return x.id===doc.prestataireId})[0]||{};
  openDlg("Informations lues dans le document",E(doc.nom)+" · "+E(typeDoc(doc.type).l),
    panneauExtrait(doc,pr),
    '<button class="btn ghost" data-act="dlg-close">Ne rien reprendre</button>'
    +'<button class="btn" data-act="appl-save" data-id="'+E(doc.id)+'">Reprendre dans la fiche</button>');
}
async function televerser(files,pid,type){
  var etat=document.getElementById("up-etat");
  function dire(t){if(etat)etat.textContent=t}
  if(!db){dire("Base indisponible.");return}
  var as=null;
  try{as=window.claude&&window.claude.use?await window.claude.use("assets"):null}catch(e){as=null}
  if(!as){dire("Le stockage de fichiers n'est pas disponible sur cette page.");return}
  for(var i=0;i<files.length;i++){
    var f=files[i];
    try{
      dire("Envoi de "+f.name+"…");
      var up=await as.upload(f);
      var doc={prestataireId:pid,type:type,nom:f.name,assetId:up.id,url:up.url,
        contentType:up.contentType,sizeBytes:up.sizeBytes,ajouteLe:new Date().toISOString()};
      var x=null;
      try{dire("Lecture de "+f.name+"…");x=await analyser(type,f)}
      catch(err){dire("Fichier enregistré. Lecture automatique impossible : "+(err&&err.message||"erreur")+".")}
      if(x&&typeof x==="object"){
        doc.extrait=x;
        doc.assureur=x.assureur||"";doc.numero=x.numeroPolice||"";
        doc.dateDebut=x.dateDebut||"";doc.dateFin=x.dateFin||"";
        dire("Document lu. Vérifiez ce qui peut être repris.");
      }
      var ref=await db.collection("documents").add(doc);
      if(x&&typeof x==="object"){doc.id=ref.id;ouvrirAppliquer(doc)}
    }catch(err){
      dire("Échec sur "+f.name+" : "+((err&&(err.message||err.code))||"erreur"));
    }
  }
}
async function restaurer(file){
  var etat=document.getElementById("rest-etat");
  function dire(t){if(etat)etat.textContent=t}
  if(!db){dire("Base indisponible.");return}
  var paquet;
  try{paquet=JSON.parse(await file.text())}
  catch(e){dire("Ce fichier n'est pas une sauvegarde lisible.");return}
  if(!paquet||paquet.format!=="vd-services-sauvegarde"||!paquet.collections){
    dire("Ce fichier n'est pas une sauvegarde VD Services.");return;
  }
  var total=0;
  COLLS.forEach(function(c){total+=(paquet.collections[c]||[]).length});
  dire("Restauration de "+total+" fiche(s)…");
  var faits=0,echecs=0;
  for(var ci=0;ci<COLLS.length;ci++){
    var c=COLLS[ci],lst=paquet.collections[c]||[];
    for(var li=0;li<lst.length;li++){
      var doc=Object.assign({},lst[li]),id=doc.id;
      delete doc.id;delete doc.local;
      if(!id){echecs++;continue}
      try{await db.doc(c+"/"+id).set(doc);faits++}catch(e){echecs++}
      if(faits%10===0)dire("Restauration… "+faits+" sur "+total);
    }
  }
  dire("Terminé : "+faits+" fiche(s) restaurée(s)"+(echecs?", "+echecs+" en échec":"")+".");
  toast("Restauration terminée");
}
document.addEventListener("change",function(ev){
  if(ev.target.id==="rest"){
    var fr=ev.target.files;
    if(fr&&fr.length)restaurer(fr[0]);
    ev.target.value="";
    return;
  }
  if(ev.target.id!=="up")return;
  var f=ev.target.files;
  if(f&&f.length)televerser(f,route.id,docTab);
  ev.target.value="";
});
document.addEventListener("dragover",function(ev){
  var z=ev.target.closest?ev.target.closest(".depot"):null;
  if(!z)return;
  ev.preventDefault();z.classList.add("sur");
});
document.addEventListener("dragleave",function(ev){
  var z=ev.target.closest?ev.target.closest(".depot"):null;
  if(z)z.classList.remove("sur");
});
document.addEventListener("drop",function(ev){
  var z=ev.target.closest?ev.target.closest(".depot"):null;
  if(!z)return;
  ev.preventDefault();z.classList.remove("sur");
  var f=ev.dataTransfer&&ev.dataTransfer.files;
  if(f&&f.length)televerser(f,route.id,docTab);
});
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="q"){flt.q=t.value;clearTimeout(qTimer);qTimer=setTimeout(paint,220);return}
  if(t.id==="cq"){flt.cq=t.value;clearTimeout(qTimer);qTimer=setTimeout(paint,220);return}
  if(t.id==="sq"){flt.sq=t.value;clearTimeout(qTimer);qTimer=setTimeout(paint,220);return}
  if(t.dataset.act==="bd-marge"){BD.marge=Number(t.value)||0;bdRefresh();return}
  if(t.dataset.bd){
    var i=Number(t.dataset.i);
    if(t.dataset.bd==="p"){
      var pid=t.dataset.p;BD.prix[pid]=BD.prix[pid]||[];
      BD.prix[pid][i]=t.value===""?null:Number(t.value);
    }else BD.lignes[i][t.dataset.bd]=t.dataset.bd==="q"?Number(t.value):t.value;
    bdRefresh();
  }
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.dataset.flt&&t.tagName==="SELECT"){flt[t.dataset.flt]=t.value;paint();return}
  if(t.dataset.act==="etat"){
    var d=DATA.demandes.filter(function(x){return x.id===t.dataset.id})[0];
    maj(t.dataset.id,{etat:t.value,journal:journalise(d,"État passé à « "+ETATS[t.value].l+" ».")});
  }
});
document.addEventListener("submit",function(ev){
  var f=ev.target.closest?ev.target.closest("[data-gate]"):null;
  if(!f)return;
  ev.preventDefault();
  connexion(f.dataset.gate);
});
document.addEventListener("keydown",function(ev){
  if(ev.key!=="Enter"&&ev.key!==" ")return;
  var g=ev.target.closest?ev.target.closest("g.mk"):null;
  if(!g)return;
  ev.preventDefault();
  selK=(selK===g.dataset.v?null:g.dataset.v);paint();
});
dlg.addEventListener("click",function(e){if(e.target===dlg)closeDlg()});
</script>
